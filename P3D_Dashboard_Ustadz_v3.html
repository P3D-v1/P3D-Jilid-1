                <div style="width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--status-hijau-bg);display:flex;align-items:center;justify-content:center;">
                  ${s.foto ? `<img src="${s.foto}" style="width:100%;height:100%;object-fit:cover;" />` : `<span style="font-size:20px;">${s.avatar}</span>`}
                </div>
                <div style="flex:1;min-width:120px;">
                  <div style="font-weight:700;font-size:13px;">${escapeHTML(s.nama)}</div>
                  <div style="font-size:11px;color:var(--teks-muted);">NISN: ${escapeHTML(s.nisn)} · Ortu: ${escapeHTML(s.namaOrtu||'belum diisi')}</div>
                </div>
                <button class="btn btn--outline btn--sm" data-action="edit-foto-siswa" data-siswa-id="${escapeHTML(s.id)}" title="Ubah foto santri">✏️ Foto</button>
                <button class="btn btn--outline btn--sm" data-action="toggle-edit-data-santri" title="Ubah nama orang tua / NISN">✏️ Data</button>
                <button class="btn btn--outline btn--sm" data-action="hapus-siswa" data-siswa-id="${escapeHTML(s.id)}" data-siswa-nama="${escapeHTML(s.nama)}" style="color:var(--status-merah);border-color:var(--status-merah);">🗑 Hapus</button>
                <div class="santri-kelola-edit" style="display:none;width:100%;gap:8px;flex-direction:column;margin-top:6px;padding-top:8px;border-top:1px dashed var(--garis);">
                  <input type="text" class="input-edit-nisn" value="${escapeHTML(s.nisn)}" placeholder="NISN" style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
                  <input type="text" class="input-edit-ortu" value="${escapeHTML(s.namaOrtu||'')}" placeholder="Nama orang tua/wali" style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
                  <button class="btn btn--primary btn--sm" data-action="simpan-data-santri" data-siswa-id="${escapeHTML(s.id)}">💾 Simpan Data</button>
                </div>
              </div>`).join('')}
        </div>
        <input type="file" id="edit-foto-siswa-file" accept="image/*" style="display:none;" />
        <div class="card" style="border-color:var(--hijau-daun);margin-top:0;">
          <div class="card__title" style="margin-bottom:12px;">➕ Tambah Santri Baru ke ${escapeHTML(kelasId)}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
            <div>
              <div class="siswa-row__section-label" style="margin-bottom:4px;">Nama Lengkap *</div>
              <input id="new-siswa-nama" type="text" placeholder="Nama lengkap santri"
                style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
            </div>
            <div>
              <div class="siswa-row__section-label" style="margin-bottom:4px;">NISN</div>
              <input id="new-siswa-nisn" type="text" placeholder="Nomor NISN"
                style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <div>
              <div class="siswa-row__section-label" style="margin-bottom:4px;">Avatar Emoji</div>
              <input id="new-siswa-avatar" type="text" placeholder="Contoh: 🦁" maxlength="4"
                style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:18px;font-family:inherit;" value="👤" />
            </div>
            <div>
              <div class="siswa-row__section-label" style="margin-bottom:4px;">Nama Orang Tua</div>
              <input id="new-siswa-ortu" type="text" placeholder="Nama orang tua/wali"
                style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
            </div>
          </div>
          <div style="margin-bottom:12px;">
            <div class="siswa-row__section-label" style="margin-bottom:4px;">📷 Foto Santri (opsional)</div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div id="foto-preview-new" style="width:56px;height:56px;border-radius:8px;background:#f3f1e7;border:1.5px dashed var(--garis);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;">👤</div>
              <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                <div style="display:flex;gap:6px;">
                  <button type="button" class="btn btn--outline btn--sm" id="btn-pilih-foto-new" style="flex:1;">📂 Pilih dari Galeri</button>
                  <button type="button" class="btn btn--outline btn--sm" id="btn-ambil-foto-new" style="flex:1;">📸 Ambil Foto</button>
                </div>
                <p style="font-size:10.5px;color:var(--teks-muted);margin:0;">JPG/PNG, max 2MB. Foto akan tampil di transkrip santri.</p>
              </div>
            </div>
            <input type="hidden" id="new-siswa-foto" value="" />
          </div>
          <button class="btn btn--primary btn--block" id="btn-tambah-siswa">➕ Tambah Santri</button>
          <input type="file" id="new-siswa-foto-file" accept="image/*" style="display:none;" />
          <input type="file" id="new-siswa-foto-camera" accept="image/*" capture="environment" style="display:none;" />
        </div>`;

      // Hapus santri
      delegate(area, 'click', '[data-action="hapus-siswa"]', async (_e, target) => {
        const nama = target.dataset.siswaNama;
        if (!confirm(`Hapus santri "${nama}" dari ${kelasId}? Data observasi santri ini tidak ikut terhapus.`)) return;
        try {
          await this.siswaRepository.delete(target.dataset.siswaId);
          showToast(`${nama} berhasil dihapus dari daftar.`);
          await loadSiswaKelas(kelasId);
        } catch(e) { showToast('Gagal menghapus santri.','error'); }
      });

      // Edit foto santri yang sudah ada — input file ini dipicu oleh tombol "✏️ Foto"
      // pada baris santri manapun, dan sistem operasi (Android/iOS) akan menawarkan
      // pilihan "Kamera" atau "Galeri/File" secara native saat dibuka.
      const editFotoInput = document.getElementById('edit-foto-siswa-file');
      delegate(area, 'click', '[data-action="edit-foto-siswa"]', (_e, target) => {
        if (!editFotoInput) return;
        editFotoInput.dataset.targetSiswaId = target.dataset.siswaId;
        editFotoInput.click();
      });
      if (editFotoInput) {
        editFotoInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          const siswaId = editFotoInput.dataset.targetSiswaId;
          if (!file || !siswaId) return;
          if (file.size > 2*1024*1024) { showToast('Ukuran foto maks 2MB.','error'); e.target.value=''; return; }
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              await this.siswaRepository.update(siswaId, { foto: ev.target.result });
              showToast('Foto santri berhasil diperbarui.');
              await loadSiswaKelas(kelasId);
            } catch(err) { showToast('Gagal memperbarui foto santri.','error'); }
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });
      }

      // Buka/tutup form edit NISN & nama orang tua per santri
      delegate(area, 'click', '[data-action="toggle-edit-data-santri"]', (_e, target) => {
        const row = target.closest('.santri-kelola-row');
        const editBox = row.querySelector('.santri-kelola-edit');
        editBox.style.display = editBox.style.display === 'none' ? 'flex' : 'none';
      });
      delegate(area, 'click', '[data-action="simpan-data-santri"]', async (_e, target) => {
        const row = target.closest('.santri-kelola-row');
        const siswaId = target.dataset.siswaId;
        const nisn = row.querySelector('.input-edit-nisn').value.trim();
        const namaOrtu = row.querySelector('.input-edit-ortu').value.trim();
        try {
          await this.siswaRepository.update(siswaId, { nisn, namaOrtu });
          showToast('Data santri berhasil diperbarui.');
          await loadSiswaKelas(kelasId);
        } catch(err) { showToast('Gagal memperbarui data santri.','error'); }
      });

      // Foto upload handler (dari galeri ATAU langsung dari kamera)
      const btnPilihFoto = document.getElementById('btn-pilih-foto-new');
      const btnAmbilFoto = document.getElementById('btn-ambil-foto-new');
      const fotoFileInput = document.getElementById('new-siswa-foto-file');
      const fotoCameraInput = document.getElementById('new-siswa-foto-camera');
      const fotoPreview = document.getElementById('foto-preview-new');
      const fotoHidden = document.getElementById('new-siswa-foto');
      const handleFotoFile = (file) => {
        if (!file) return;
        if (file.size > 2*1024*1024) { showToast('Ukuran foto maks 2MB.','error'); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          fotoHidden.value = dataUrl;
          fotoPreview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;" />`;
        };
        reader.readAsDataURL(file);
      };
      if (btnPilihFoto && fotoFileInput) {
        btnPilihFoto.addEventListener('click', () => fotoFileInput.click());
        fotoFileInput.addEventListener('change', (e) => handleFotoFile(e.target.files[0]));
      }
      if (btnAmbilFoto && fotoCameraInput) {
        btnAmbilFoto.addEventListener('click', () => fotoCameraInput.click());
        fotoCameraInput.addEventListener('change', (e) => handleFotoFile(e.target.files[0]));
      }

      // Tambah siswa
      document.getElementById('btn-tambah-siswa').addEventListener('click', async () => {
        const nama = document.getElementById('new-siswa-nama').value.trim();
        const nisn = document.getElementById('new-siswa-nisn').value.trim() || '-';
        const avatar = document.getElementById('new-siswa-avatar').value.trim() || '👤';
        const namaOrtu = document.getElementById('new-siswa-ortu').value.trim();
        const foto = document.getElementById('new-siswa-foto')?.value || '';
        if (!nama) { showToast('Nama santri wajib diisi.','error'); return; }
        const id = `${kelasId.replace(/\s/g,'-').toLowerCase()}-${Date.now()}`;
        try {
          await this.siswaRepository.create({ id, nama, nisn, kelasId, avatar, namaOrtu, foto });
          showToast(`${nama} berhasil ditambahkan ke ${kelasId}!`);
          await loadSiswaKelas(kelasId);
        } catch(e) { showToast('Gagal menambah santri.','error'); }
      });
    };

    const kelasAwalId = semuaKelas[0]?.id;
    if (kelasAwalId) await loadSiswaKelas(kelasAwalId);

    document.getElementById('pilih-kelas-siswa').addEventListener('change', async (e) => {
      await loadSiswaKelas(e.target.value);
    });

    // ── BACKUP DATA ──
    const btnBackup = document.getElementById('btn-backup-json');
    const backupInfo = document.getElementById('backup-info');
    if (btnBackup) {
      // Tampilkan info ringkas ukuran data
      try {
        const keys = ['p3d_siswa_v1','p3d_kelas_v1','p3d_observations_v1','p3d_absen_v1','p3d_settings_v1','p3d_meta_v1','p3d_kelas_aktif_v1','p3d_theme_v1'];
        let totalChars = 0;
        keys.forEach(k => { totalChars += (localStorage.getItem(k)||'').length; });
        const kb = (totalChars / 1024).toFixed(1);
        if (backupInfo) {
          backupInfo.style.display = '';
          const siswaRaw = JSON.parse(localStorage.getItem('p3d_siswa_v1')||'[]');
          const obsRaw = JSON.parse(localStorage.getItem('p3d_observations_v1')||'{}');
          const totalSiswa = siswaRaw.length;
          const totalObs = Object.values(obsRaw).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0);
          backupInfo.innerHTML = `📊 Data saat ini: <strong>${totalSiswa} santri</strong>, <strong>${totalObs} observasi</strong> — ukuran ≈ <strong>${kb} KB</strong>`;
        }
      } catch(e) {}

      btnBackup.addEventListener('click', () => {
        try {
          const keys = ['p3d_siswa_v1','p3d_kelas_v1','p3d_observations_v1','p3d_absen_v1','p3d_settings_v1','p3d_meta_v1','p3d_kelas_aktif_v1','p3d_theme_v1'];
          const snapshot = {};
          keys.forEach(k => {
            const v = localStorage.getItem(k);
            if (v !== null) { try { snapshot[k] = JSON.parse(v); } catch(e) { snapshot[k] = v; } }
          });
          snapshot._meta = {
            backupAt: new Date().toISOString(),
            appVersion: 'P3D Dashboard Ustadz v2',
            namaSekolah: loadSettings().sekolah.nama || 'P3D',
          };
          const json = JSON.stringify(snapshot, null, 2);
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const namaSekolah = (loadSettings().sekolah.nama || 'P3D').replace(/[^a-zA-Z0-9\u00C0-\u024F\u4e00-\u9fff\s]/g, '').replace(/\s+/g, '-');
          const tgl = new Date().toISOString().slice(0,10);
          a.href = url;
          a.download = `P3D_Backup_${namaSekolah}_${tgl}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('✅ Backup JSON berhasil diunduh!');
        } catch(err) {
          showToast('Gagal membuat backup: ' + err.message, 'error');
        }
      });
    }

    // ── RESTORE DATA ──
    const inputRestore = document.getElementById('input-restore-json');
    const btnRestore = document.getElementById('btn-restore-json');
    const restorePreview = document.getElementById('restore-preview');
    let _pendingRestoreData = null;

    if (inputRestore) {
      inputRestore.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.name.endsWith('.json') && file.type !== 'application/json') {
          showToast('Pilih file dengan ekstensi .json', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            _pendingRestoreData = data;
            // Tampilkan ringkasan isi backup
            const meta = data._meta || {};
            const siswa = Array.isArray(data['p3d_siswa_v1']) ? data['p3d_siswa_v1'].length : '?';
            const obs = data['p3d_observations_v1'] ? Object.values(data['p3d_observations_v1']).reduce((a,v)=>a+(Array.isArray(v)?v.length:0),0) : '?';
            const tgl = meta.backupAt ? new Date(meta.backupAt).toLocaleString('id-ID') : 'tidak diketahui';
            const sekolah = meta.namaSekolah || '—';
            if (restorePreview) {
              restorePreview.style.display = '';
              restorePreview.innerHTML = `
                <strong>📦 File Backup Valid</strong><br>
                🏫 Lembaga: <strong>${escapeHTML(sekolah)}</strong><br>
                📅 Dibuat: <strong>${escapeHTML(tgl)}</strong><br>
                👤 Santri: <strong>${siswa}</strong> &nbsp;|&nbsp; 📝 Observasi: <strong>${obs}</strong><br>
                <span style="color:var(--status-merah);font-weight:600;">⚠️ Data saat ini akan digantikan sepenuhnya. Pastikan ini file yang benar.</span>`;
            }
            if (btnRestore) btnRestore.style.display = '';
          } catch(err) {
            _pendingRestoreData = null;
            if (restorePreview) {
              restorePreview.style.display = '';
              restorePreview.innerHTML = `<span style="color:var(--status-merah);">❌ File tidak valid atau rusak. Pastikan file adalah backup P3D yang asli.</span>`;
            }
            if (btnRestore) btnRestore.style.display = 'none';
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
    }

    if (btnRestore) {
      btnRestore.addEventListener('click', () => {
        if (!_pendingRestoreData) { showToast('Belum ada file backup yang dipilih.', 'error'); return; }
        if (!confirm('PERHATIAN: Seluruh data saat ini akan digantikan dengan data dari file backup ini.\n\nYakin ingin melanjutkan?')) return;
        try {
          const validKeys = ['p3d_siswa_v1','p3d_kelas_v1','p3d_observations_v1','p3d_absen_v1','p3d_settings_v1','p3d_meta_v1','p3d_kelas_aktif_v1','p3d_theme_v1'];
          validKeys.forEach(k => {
            if (_pendingRestoreData[k] !== undefined) {
              const val = typeof _pendingRestoreData[k] === 'string' ? _pendingRestoreData[k] : JSON.stringify(_pendingRestoreData[k]);
              localStorage.setItem(k, val);
            }
          });
          showToast('✅ Restore berhasil! Halaman akan dimuat ulang...');
          setTimeout(() => window.location.reload(), 1500);
        } catch(err) {
          showToast('Gagal merestore data: ' + err.message, 'error');
        }
      });
    }
  }
}

// ── Router ──
class Router {
  constructor(routes, defaultRoute, container, onRouteChange=()=>{}) {
    this.routes = routes; this.defaultRoute = defaultRoute;
    this.container = container; this.onRouteChange = onRouteChange;
    window.addEventListener('hashchange', () => this._handle());
  }
  start() {
    if (!window.location.hash) window.location.hash = `#${this.defaultRoute}`;
    else this._handle();
  }
  navigateTo(routeId) { window.location.hash = `#${routeId}`; }
  async _handle() {
    const routeId = window.location.hash.replace('#','') || this.defaultRoute;
    const handler = this.routes[routeId] || this.routes[this.defaultRoute];
    this.onRouteChange(routeId in this.routes ? routeId : this.defaultRoute);
    await handler(this.container);
  }
}

// ── Bootstrap ──
async function bootstrap() {
  const siswaRepository = new SiswaRepository();
  const kelasRepository = new KelasRepository();
  const observasiRepository = new ObservasiRepository();
  const absenRepository = new AbsenRepository();
  await Promise.all([siswaRepository.pastikanSeed(), kelasRepository.pastikanSeed()]);
  const scoringService = new P3DScoringService(observasiRepository);
  const absenObservasiService = new AbsenObservasiService(absenRepository, observasiRepository, siswaRepository);
  const rekapMingguanService = new RekapMingguanService(absenRepository, observasiRepository, siswaRepository, scoringService);
  const cetakHarianService = new CetakHarianService(absenObservasiService, kelasRepository);

  qs('#app-shell').innerHTML = renderTopbar({
    namaSekolah: IDENTITAS_SEKOLAH.nama,
    namaPengguna: GURU_AKTIF.nama,
    subPengguna: `Dashboard Ustadz/ah P3D`,
    inisial: GURU_AKTIF.inisial,
  });

  const contentEl = qs('#page-content');
  const navSidebar = qs('#nav-sidebar-slot');
  const navBottom = qs('#nav-bottom-slot');

  function renderNavigasi(activePageId) {
    navSidebar.innerHTML = renderSidebar(MENU_GURU, activePageId);
    navBottom.innerHTML = renderBottomNav(MENU_GURU, activePageId);
    qsa('[data-nav-id]', navSidebar).forEach(btn => btn.addEventListener('click', () => router.navigateTo(btn.dataset.navId)));
    qsa('[data-nav-id]', navBottom).forEach(btn => btn.addEventListener('click', () => router.navigateTo(btn.dataset.navId)));
  }

  // Kelas/jilid yang sedang dilihat — persisten di localStorage, dibagikan
  // ke semua halaman (Absen/Rekap/Cetak/Transkrip) lewat callback agar
  // tetap sinkron satu sama lain dan tidak hilang saat refresh.
  let kelasAktifId = loadKelasAktif();
  const semuaKelasAwal = await kelasRepository.getAll();
  if (!semuaKelasAwal.some(k => k.id === kelasAktifId)) {
    kelasAktifId = semuaKelasAwal[0]?.id || DEFAULT_KELAS_AKTIF;
  }
  const onKelasAktifBerubah = (idBaru) => {
    kelasAktifId = idBaru;
    saveKelasAktif(idBaru);
  };
  const absenPage = new AbsenPage({ absenObservasiService, kelasRepository, kelasAktifId, namaGuru: GURU_AKTIF.nama, semester: IDENTITAS_SEKOLAH.semesterAktif, onKelasAktifBerubah });
  const rekapPage = new RekapMingguanPage({ rekapMingguanService, kelasRepository, kelasAktifId, onKelasAktifBerubah });
  const cetakPage = new CetakHarianPage({ cetakHarianService, kelasRepository, kelasAktifId, onKelasAktifBerubah });
  const transkripPage = new TranskripPage({ siswaRepository, kelasRepository, kelasAktifId, onKelasAktifBerubah });
  const pengaturanPage = new PengaturanPage({ siswaRepository, kelasRepository });

  const router = new Router(
    {
      absen: c => absenPage.render(c),
      rekap: c => rekapPage.render(c),
      cetak: c => cetakPage.render(c),
      transkrip: c => transkripPage.render(c),
      pengaturan: c => pengaturanPage.render(c),
    },
    'absen', contentEl, activeRouteId => renderNavigasi(activeRouteId)
  );
  router.start();
}

// ── THEME (dark/light) ──
function loadTheme() {
  try { return localStorage.getItem('p3d_theme_v1') || 'light'; } catch(e) { return 'light'; }
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0d2818' : '#0d2818');
  // Update toggle button jika sudah ada di DOM
  const icon = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
  if (label) label.textContent = theme === 'dark' ? 'Terang' : 'Gelap';
  // Update toggle di pengaturan jika ada
  const toggleSwitch = document.getElementById('toggle-dark-mode');
  if (toggleSwitch) toggleSwitch.checked = theme === 'dark';
}
function toggleTheme() {
  const current = loadTheme();
  const next = current === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('p3d_theme_v1', next); } catch(e) {}
  applyTheme(next);
}
// Terapkan tema saat halaman pertama dimuat (sebelum DOM render penuh)
applyTheme(loadTheme());

bootstrap().catch(err => {
  console.error('Gagal memulai aplikasi P3D:', err);
  const root = document.getElementById('page-content');
  if (root) root.innerHTML = `<div class="empty-state"><span class="empty-state__icon">⚠️</span><p>Terjadi kesalahan saat memuat aplikasi. Coba muat ulang halaman.</p></div>`;
});

</script>

<script>
/* ════════ LOGIC TRANSKRIP 8 HALAMAN ════════ */

/* ════════ LOGIC TRANSKRIP 8 HALAMAN (digabung dari file terpisah) ════════ */

/* ════════════════════════════════════════════════════════════════
   DATA SISWA / SEKOLAH — daftar siswa yang transkripnya bisa dibuat.
   Ini HANYA metadata identitas (nama, kelas, NISN, dst), BUKAN skor.
   Semua skor/observasi ditarik dari P3D engine (localStorage),
   yang diisi melalui Dashboard Ustadz/ah.
   ════════════════════════════════════════════════════════════════ */
const SEKOLAH = new Proxy({}, {
  get(_, k) {
    const s = loadSettings().sekolah;
    if (k === 'nama') return s.nama;
    if (k === 'tagline') return 'Lembaga Berbasis Tartil, Tadarus, dan Pembentukan Akhlak';
    if (k === 'logoTPA') return s.logoTPA || '';
    return s[k];
  }
});

// ════════════════════════════════════════════════════════════════
// SUMBER DATA TUNGGAL: dulu DAFTAR_SISWA_TRX adalah array statis
// terpisah dari SiswaRepository/KelasRepository, sehingga santri
// baru yang ditambahkan lewat Pengaturan tidak muncul di Transkrip,
// dan foto/NISN bisa tidak sinkron. Sekarang dibaca langsung dari
// localStorage yang sama persis dengan yang dipakai SiswaRepository
// & KelasRepository, agar Absen/Observasi/Rekap/Transkrip selalu
// konsisten dan dapat ditelusuri ke satu sumber data yang sama.
// ════════════════════════════════════════════════════════════════
function _bacaSiswaMentahLS(){
  try { const a = JSON.parse(localStorage.getItem('p3d_siswa_v1')||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function _bacaKelasMentahLS(){
  try { const a = JSON.parse(localStorage.getItem('p3d_kelas_v1')||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function getDaftarSiswaTrx(){
  const semuaSiswa = _bacaSiswaMentahLS();
  const semuaKelas = _bacaKelasMentahLS();
  const kelasMap = {};
  semuaKelas.forEach(k => { kelasMap[k.id] = k; });
  return semuaSiswa.map(s => ({
    id: s.id,
    nama: s.nama,
    nisn: s.nisn,
    kelas: s.kelasId,
    wali: (kelasMap[s.kelasId]?.namaGuru) || GURU_AKTIF.nama || '—',
    avatar: s.avatar || '👤',
    foto: s.foto || '',
    namaOrtu: s.namaOrtu || '',
  }));
}
// Getter live agar selalu mengambil data terbaru dari localStorage,
// bukan snapshot beku saat skrip pertama kali dimuat.
const DAFTAR_SISWA_TRX = new Proxy([], {
  get(_, prop) {
    const live = getDaftarSiswaTrx();
    if (prop === 'length') return live.length;
    if (typeof prop === 'symbol' || prop === 'constructor') return live[prop];
    if (!isNaN(prop)) return live[prop];
    // method array (map/find/filter/some/forEach/slice/dst) dijalankan di atas data live
    const v = live[prop];
    return typeof v === 'function' ? v.bind(live) : v;
  }
});
const SEMESTER_AKTIF = new Proxy({}, {
  get(_, k) {
    const sem = loadSettings().sekolah.semesterAktif || 'Ganjil 2026/2027';
    // e.g. "Ganjil 2026/2027" -> label="Semester Ganjil", tahunAjaran="2026/2027"
    const parts = sem.split(' ');
    const ta = parts.slice(1).join(' ');
    const lbl = 'Semester ' + parts[0];
    if (k === 'label') return lbl;
    if (k === 'tahunAjaran') return ta;
    return sem;
  }
});

let currentSiswaTrx = DAFTAR_SISWA_TRX[0]?.id || null;

function getSiswaTrx(id){
  const list = getDaftarSiswaTrx();
  return list.find(s=>s.id===id) || list[0] || { id:'', nama:'(Belum ada santri)', nisn:'-', kelas:'-', wali:'-', avatar:'👤', foto:'' };
}

// ── Helper format & label ──
function fmtTglID(iso){
  if(!iso) return '—';
  const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTglSlash(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function arahDotClass(level){ return P3D.SKALA[level]?.dot || 'dot-cukup'; }
function arahLabelFromLevel(level){
  const a = P3D.SKALA[level]?.arah;
  return {positif:'Positif',berkembang:'Berkembang',cukup:'Cukup',pendampingan:'Perlu Pendampingan'}[a] || '—';
}
function arahColorFromLevel(level){
  const a = P3D.SKALA[level]?.arah;
  return {positif:'#059669',berkembang:'#3b82f6',cukup:'#d97706',pendampingan:'#dc2626'}[a] || '#6b7280';
}
function statusBadge(kategori){
  const map = {
    'Sangat Baik': {c:'#059669', bg:'#065f46', txt:'#fff'},
    'Baik': {c:'#3b82f6', bg:'#3b82f6', txt:'#fff'},
    'Cukup': {c:'#d97706', bg:'#d97706', txt:'#fff'},
    'Perlu Pendampingan': {c:'#dc2626', bg:'#dc2626', txt:'#fff'},
    'Data Belum Cukup': {c:'#94a3b8', bg:'#e5e7eb', txt:'#6b7280'},
  };
  return map[kategori] || map['Data Belum Cukup'];
}
function escapeAttr(s){ return String(s==null?'':s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

/* ════════════════════════════════════════════════════════════════
   DRILL-DOWN: klik angka (IPP / skor domain / skor indikator)
   untuk menampilkan rincian observasi yang menjadi sumbernya.
   Dipanggil dari onclick="" yang disisipkan ke template halaman.
   ════════════════════════════════════════════════════════════════ */
function openTraceModal(title, rows){
  document.getElementById('traceModalTitle').textContent = title;
  const body = document.getElementById('traceModalBody');
  if(!rows.length){
    body.innerHTML = `<div class="empty-state">Belum ada observasi untuk data ini. Input observasi melalui Dashboard Ustadz/ah terlebih dahulu.</div>`;
  } else {
    body.innerHTML = rows.map(r=>`
      <div class="trace-row">
        <span class="${arahDotClass(r.level)}" style="margin-top:4px;"></span>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <span style="font-weight:700;font-size:12px;color:#111827;">${r.refCode}</span>
            <span style="font-size:11px;color:#6b7280;font-family:monospace;">${fmtTglSlash(r.tanggal)}</span>
          </div>
          <p style="font-size:11.5px;color:#374151;margin-top:2px;line-height:1.5;">${r.catatan || '(tanpa catatan)'}</p>
          <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">
            <span style="font-size:10px;color:#9ca3af;">Konteks: ${r.konteks||'—'}</span>
            <span style="font-size:10px;color:#9ca3af;">Ustadz/ah: ${r.guru||'—'}</span>
            <span style="font-size:10px;font-weight:700;color:${arahColorFromLevel(r.level)};">Level ${r.level} · ${arahLabelFromLevel(r.level)} (nilai ${P3D.SKALA[r.level].nilai})</span>
          </div>
        </div>
      </div>`).join('');
  }
  document.getElementById('traceModalOverlay').classList.add('show');
}
function closeTraceModal(){ document.getElementById('traceModalOverlay').classList.remove('show'); }

function traceIPP(){
  const ipp = P3D.hitungIPP(currentSiswaTrx);
  const obsList = P3D.getForStudent(currentSiswaTrx).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  const detail = P3D.DOMAINS.map(d=>{
    const r = ipp.rekap[d];
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:11.5px;">
      <span>${P3D.DOMAIN_INFO[d].ico} ${P3D.DOMAIN_INFO[d].lbl}</span>
      <span style="font-weight:700;color:${P3D.DOMAIN_INFO[d].color};">${r.skor!==null?r.skor:'—'} <span style="color:#9ca3af;font-weight:500;">(${r.jumlahObs} observasi)</span></span>
    </div>`;
  }).join('');
  document.getElementById('traceModalTitle').textContent = `IPP ${ipp.ipp!==null?ipp.ipp:'—'} — Rincian per Domain`;
  document.getElementById('traceModalBody').innerHTML = `
    <p style="font-size:11px;color:#6b7280;margin-bottom:10px;">IPP dihitung dari rata-rata skor 5 domain berikut. Klik nama domain pada halaman ringkasan untuk melihat observasi detail.</p>
    ${detail}
    <p style="font-size:10px;color:#9ca3af;margin-top:10px;">Total ${obsList.length} observasi tercatat untuk peserta didik ini.</p>`;
  document.getElementById('traceModalOverlay').classList.add('show');
}
function traceDomain(domain){
  const obsList = P3D.getForStudent(currentSiswaTrx).filter(o=>o.domain===domain).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  openTraceModal(`Domain ${P3D.DOMAIN_INFO[domain].lbl} — ${obsList.length} Observasi`, obsList);
}
function traceIndikator(domain, indikatorId){
  const obsList = P3D.getForStudent(currentSiswaTrx).filter(o=>o.domain===domain && o.indikatorId===indikatorId).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  const indLabel = (P3D.INDIKATOR[domain]||[]).find(i=>i.id===indikatorId)?.label || indikatorId;
  openTraceModal(`${indLabel} — ${obsList.length} Observasi`, obsList);
}
function traceRef(refCode){
  const obsList = P3D.getForStudent(currentSiswaTrx).filter(o=>o.refCode===refCode);
  openTraceModal(`Bukti ${refCode}`, obsList);
}

/* ════════════════════════════════════════════════════════════════
   SISTEM KODE REFERENSI OBSERVASI LEMBAGA (P3D Traceability Layer)
   Format: LBG-Domain-Indikator-Urutan
   Contoh: KDM-HH-001 = Kemampuan Dasar Membaca / Huruf Hijaiyah / #1
   ════════════════════════════════════════════════════════════════ */
const OBS_KODE = {
  // ── ADAB BERBICARA & SOPAN SANTUN (ABS) ──
  komunikasi: {
    prefix: 'ABS',
    label: 'Adab Berbicara & Sopan Santun',
    indikator: {
      bicara:    { kode:'BS', label:'Berbicara Sopan & Santun' },
      ide:       { kode:'AU', label:'Adab kepada Ustadz/ah' },
      dengar:    { kode:'MD', label:'Mendengarkan saat Belajar' },
    }
  },
  // ── KERJA SAMA & UKHUWAH (KSU) ──
  kolaborasi: {
    prefix: 'KSU',
    label: 'Kerja Sama & Ukhuwah',
    indikator: {
      kerjasama:   { kode:'KK', label:'Kerja Sama Kelompok' },
      kontribusi:  { kode:'UK', label:'Ukhuwah Islamiyah' },
      menghargai:  { kode:'MS', label:'Menghargai Sesama Santri' },
    }
  },
  // ── KEMANDIRIAN IBADAH & BELAJAR (KIB) ──
  kemandirian: {
    prefix: 'KIB',
    label: 'Kemandirian Ibadah & Belajar',
    indikator: {
      inisiatif:       { kode:'WB', label:'Wudhu & Bersuci Mandiri' },
      tanggungjawab:   { kode:'SL', label:'Salat Mandiri' },
      manajemenwaktu:  { kode:'MR', label:'Mandiri Murojaah & Belajar' },
    }
  },
  // ── ISTIQAMAH & SEMANGAT BELAJAR (ISB) ──
  ketangguhan: {
    prefix: 'ISB',
    label: 'Istiqamah & Semangat Belajar',
    indikator: {
      pantangmenyerah: { kode:'MH', label:'Murojaah Harian' },
      strategi:        { kode:'SB', label:'Semangat Mengulang Bacaan' },
      ketekunan:       { kode:'TJ', label:'Tekun Menyelesaikan Target Jilid' },
    }
  },
  // ── AKHLAK, AMANAH & DISIPLIN IBADAH (AAD) ──
  karakter: {
    prefix: 'AAD',
    label: 'Akhlak, Amanah & Disiplin Ibadah',
    indikator: {
      jujur:    { kode:'JA', label:'Kejujuran & Amanah' },
      empati:   { kode:'AM', label:'Akhlak Mulia' },
      disiplin: { kode:'DI', label:'Disiplin Ibadah & Tata Tertib Lembaga' },
    }
  },
};

/** Hasilkan kode lembaga dari sebuah observasi */
function tpaKodeFromObs(obs){
  const tpa = OBS_KODE[obs.domain];
  if(!tpa) return obs.refCode;
  const indRef = tpa.indikator[obs.indikatorId];
  const indKode = indRef ? indRef.kode : 'UM';
  // Ambil nomor urut dari refCode asli (mis KOM01 → 01)
  const match = (obs.refCode||'').match(/\d+$/);
  const urut = match ? String(parseInt(match[0],10)).padStart(3,'0') : '001';
  return `${tpa.prefix}-${indKode}-${urut}`;
}

/** Label indikator lembaga */
function tpaIndikatorLabel(domain, indikatorId){
  return OBS_KODE[domain]?.indikator[indikatorId]?.label || indikatorId;
}

/** Label bukti dari field bukti observasi */
function buktiLabel(obs){
  const b = obs.bukti || obs.konteks || '';
  if(!b) return 'Observasi Langsung';
  if(b.toLowerCase().includes('setoran')) return 'Setoran Bacaan';
  if(b.toLowerCase().includes('audio')) return 'Audio';
  if(b.toLowerCase().includes('video')) return 'Video';
  if(b.toLowerCase().includes('murajaah')||b.toLowerCase().includes('muraja')) return 'Murajaah';
  if(b.toLowerCase().includes('kelompok')) return 'Praktik Kelompok';
  return 'Observasi Langsung';
}

/** Hitung ringkasan traceability untuk satu santri */
function hitungJejakData(siswaId){
  const obsList = P3D.getForStudent(siswaId);
  const totalObs = obsList.length;
  const totalBukti = P3D.jumlahBuktiValid(siswaId);
  const domainTeramati = new Set(obsList.map(o=>o.domain)).size;
  const indikatorTeramati = new Set(obsList.map(o=>o.domain+'|'+o.indikatorId)).size;
  const tanggalList = obsList.map(o=>o.tanggal).filter(Boolean).sort();
  const periodeAwal = tanggalList[0] || null;
  const periodeAkhir = tanggalList[tanggalList.length-1] || null;
  // Kode referensi range per domain
  const rangePerDomain = {};
  P3D.DOMAINS.forEach(d=>{
    const tpa = OBS_KODE[d];
    if(!tpa) return;
    const domObs = obsList.filter(o=>o.domain===d);
    if(!domObs.length){ rangePerDomain[d]=null; return; }
    const kodes = domObs.map(o=>tpaKodeFromObs(o)).sort();
    rangePerDomain[d] = { dari: kodes[0], sampai: kodes[kodes.length-1], n: kodes.length };
  });
  return { totalObs, totalBukti, domainTeramati, indikatorTeramati, periodeAwal, periodeAkhir, rangePerDomain };
}

/** HTML blok REFERENSI OBSERVASI P3D — bar ringkasan yang ditambahkan di tiap halaman */
function refObsBarHTML(domain){
  const obsList = P3D.getForStudent(currentSiswaTrx).filter(o=>o.domain===domain);
  const tpa = OBS_KODE[domain];
  if(!tpa || !obsList.length) return '';
  const kodes = obsList.map(o=>tpaKodeFromObs(o)).sort();
  const buktiValid = obsList.filter(o=>o.catatan).length;
  return `
  <div style="margin-top:8px;padding:8px 12px;background:#fefce8;border:1px solid #fde047;border-radius:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
      <span style="font-size:13px;">🔗</span>
      <span style="font-size:10px;font-weight:800;color:#854d0e;text-transform:uppercase;letter-spacing:.05em;">Referensi Observasi P3D</span>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;flex:1;">
      <span style="font-size:10px;color:#713f12;"><strong>Jumlah Observasi:</strong> ${obsList.length}</span>
      <span style="font-size:10px;color:#713f12;"><strong>Bukti Terverifikasi:</strong> ${buktiValid}</span>
      <span style="font-size:10px;color:#713f12;"><strong>Kode:</strong> ${kodes[0]}${kodes.length>1?' s.d. '+kodes[kodes.length-1]:''}</span>
    </div>
  </div>`;
}

/** Tabel REFERENSI OBSERVASI dengan kolom Kode Lembaga, Tanggal, Indikator, Level, Bukti */
function tpaObsTableHTML(domain){
  const info = P3D.DOMAIN_INFO[domain];
  const tpa = OBS_KODE[domain];
  const obsList = P3D.getForStudent(currentSiswaTrx).filter(o=>o.domain===domain).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
  if(!obsList.length){
    return `<div class="empty-state">Belum ada observasi untuk domain ${tpa?.label||info.lbl}.</div>`;
  }
  return `
  <table class="obs-table">
    <thead>
      <tr>
        <th>Kode Obs.</th>
        <th>Tanggal</th>
        <th>Indikator</th>
        <th>Level</th>
        <th>Bukti</th>
        <th>Deskripsi</th>
      </tr>
    </thead>
    <tbody>
      ${obsList.map(o=>{
        const kode = tpaKodeFromObs(o);
        const lvl = P3D.SKALA[o.level];
        const indLbl = tpaIndikatorLabel(domain, o.indikatorId);
        const bkt = buktiLabel(o);
        return `
        <tr class="traceable" onclick="traceRef('${o.refCode}')">
          <td><span class="ref-code" style="color:${info.color};font-family:monospace;">${kode}</span></td>
          <td style="font-size:10.5px;color:#6b7280;white-space:nowrap;">${fmtTglSlash(o.tanggal)}</td>
          <td style="font-size:10.5px;color:#374151;">${indLbl}</td>
          <td><span style="display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;background:${lvl?P3D.DOMAIN_INFO[domain].bg:'#f3f4f6'};color:${arahColorFromLevel(o.level)};">L${o.level}</span></td>
          <td style="font-size:10px;color:#6b7280;white-space:nowrap;">${bkt}</td>
          <td style="font-size:10.5px;color:#374151;">${o.catatan||'—'}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  ${refObsBarHTML(domain)}`;
}

/** Blok JEJAK DATA P3D untuk halaman 8 */
function jejakDataP3DHTML(siswaId){
  const j = hitungJejakData(siswaId);
  const periodeStr = (j.periodeAwal && j.periodeAkhir)
    ? `${fmtTglID(j.periodeAwal)} s.d. ${fmtTglID(j.periodeAkhir)}`
    : '—';
  const rangeRows = P3D.DOMAINS.map(d=>{
    const tpa = OBS_KODE[d];
    const r = j.rangePerDomain[d];
    if(!tpa||!r) return '';
    return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #fef9c3;font-size:10.5px;">
      <span style="color:#713f12;font-weight:600;">${tpa.label}</span>
      <span style="font-family:monospace;font-weight:700;color:#854d0e;">${r.dari}${r.n>1?' s.d. '+r.sampai:''} <span style="color:#a16207;font-weight:500;">(${r.n} obs)</span></span>
    </div>`;
  }).filter(Boolean).join('');
  return `
  <div style="border:2px solid #fde047;border-radius:12px;padding:14px 18px;background:#fefce8;margin-top:10px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <div style="width:30px;height:30px;border-radius:50%;background:#854d0e;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;">🔗</div>
      <p style="font-size:13px;font-weight:800;color:#713f12;text-transform:uppercase;letter-spacing:.04em;">JEJAK DATA P3D</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;">
      ${[
        ['Total Observasi', j.totalObs, '#065f46'],
        ['Total Bukti Pembelajaran', j.totalBukti, '#1d4ed8'],
        ['Total Domain Teramati', j.domainTeramati+' dari 5', '#7e22ce'],
        ['Total Indikator Teramati', j.indikatorTeramati, '#9f1239'],
      ].map(([l,v,c])=>`
      <div style="background:#fff;border:1px solid #fde047;border-radius:8px;padding:8px 12px;">
        <p style="font-size:9.5px;color:#a16207;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;">${l}</p>
        <p style="font-size:22px;font-weight:800;color:${c};line-height:1;">${v}</p>
      </div>`).join('')}
    </div>
    <div style="background:#fff;border:1px solid #fde047;border-radius:8px;padding:10px 12px;margin-bottom:8px;">
      <p style="font-size:9.5px;color:#a16207;font-weight:700;text-transform:uppercase;margin-bottom:6px;">Periode Observasi</p>
      <p style="font-size:11.5px;font-weight:700;color:#713f12;">${periodeStr}</p>
    </div>
    <div style="background:#fff;border:1px solid #fde047;border-radius:8px;padding:10px 12px;margin-bottom:8px;">
      <p style="font-size:9.5px;color:#a16207;font-weight:700;text-transform:uppercase;margin-bottom:6px;">Kode Referensi per Domain</p>
      ${rangeRows || '<p style="font-size:10.5px;color:#9ca3af;">Belum ada observasi tercatat.</p>'}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:5px;">
        <span style="color:#059669;font-size:14px;">✓</span>
        <span style="font-size:10px;color:#374151;font-weight:600;">Diverifikasi Ustadz/Ustadzah</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;">
        <span style="color:#059669;font-size:14px;">✓</span>
        <span style="font-size:10px;color:#374151;font-weight:600;">Diverifikasi Kepala Lembaga</span>
      </div>
    </div>
  </div>`;
}

function onChangeSiswaTrx(){
  currentSiswaTrx = document.getElementById('selSiswaTrx').value;
  renderBook();
}

// ── Helper: header halaman bersama (halaman 2-8) ──
function pageHeader(pageNum){

// ── Helper: render mini chart SVG untuk 1 domain dari seri bulanan asli ──
const BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function miniChartSVG(domain, color, opts){
  const w = opts.w, h = 80;
  const { seriBulanan, p1, p2, delta } = P3D.pertumbuhanDomain(currentSiswaTrx, domain);
  if(!seriBulanan.length){
    return { svg:`<div style="display:flex;align-items:center;justify-content:center;height:${h}px;color:#9ca3af;font-size:10px;">Belum ada data observasi</div>`, labels:'', p1, p2, delta };
  }
  const vals = seriBulanan.map(s=>s.skor);
  const minV = Math.min(...vals,50), maxV = Math.max(...vals,100);
  const pad = 20;
  const n = seriBulanan.length;
  const xs = n===1 ? [w/2] : seriBulanan.map((_,i)=> pad + i*((w-2*pad)/(n-1)) );
  const toY = v => h - ((v-minV)/((maxV-minV)||1))*h*0.85 - 5;
  const pathD = vals.map((v,i)=>`${i===0?'M':'L'}${xs[i]},${toY(v)}`).join(' ');
  const circles = vals.map((v,i)=>`<circle cx="${xs[i]}" cy="${toY(v)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const labels = vals.map((v,i)=>`<text x="${xs[i]}" y="${toY(v)-7}" text-anchor="middle" font-size="8" fill="${color}" font-weight="700">${v}</text>`).join('');
  const gridLines = [20,40,60].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#f3f4f6" stroke-width="1"/>`).join('');
  const svg = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${gridLines}<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"/>${circles}${labels}</svg>`;
  const monthLabels = seriBulanan.map(s=>BULAN_SINGKAT[parseInt(s.bulan.slice(5,7),10)-1]).join('|');
  return { svg, monthLabels: seriBulanan.map(s=>BULAN_SINGKAT[parseInt(s.bulan.slice(5,7),10)-1]), p1, p2, delta };
}

// ── Populate selector siswa ──
function populateSiswaSelect(){
  const sel = document.getElementById('selSiswaTrx');
  const daftar = getDaftarSiswaTrx();
  sel.innerHTML = daftar.length
    ? daftar.map(s=>`<option value="${s.id}">${s.nama} — ${s.kelas}</option>`).join('')
    : `<option value="">(Belum ada santri terdaftar)</option>`;
  sel.value = currentSiswaTrx || '';
}

// (readSiswaFromURL tidak diperlukan lagi — siswa dipilih langsung lewat openTranskripOverlay(sid)
// saat dipanggil dari Dashboard Ustadz/ah, karena kini satu file, bukan navigasi antar file/URL.)

// ── Scaling responsif: halaman 794px di-scale agar pas di lebar viewport (tanpa terpotong) ──
function rescalePages(){
  const vw = window.innerWidth;
  const margin = vw <= 760 ? 12 : 40;
  const available = Math.min(vw - margin, 794);
  const scale = Math.min(1, available / 794);
  document.querySelectorAll('#transkripOverlay .page-scale').forEach(el=>{
    el.style.transform = `scale(${scale})`;
  });
  document.querySelectorAll('#transkripOverlay .page-scale-wrap').forEach(el=>{
    // Wrapper diberi lebar & tinggi SESUAI hasil visual scale, agar flexbox
    // 'align-items:center' pada .book bisa men-center dengan benar.
    el.style.width = (794*scale) + 'px';
    el.style.height = (1123*scale) + 'px';
  });
}
window.addEventListener('resize', function(){
  if(isTranskripOverlayOpen()) rescalePages();
});

// ── Overlay terbuka/tertutup (transkrip kini modal penuh layar di dalam Dashboard Ustadz/ah, bukan file terpisah) ──
function isTranskripOverlayOpen(){
  const el = document.getElementById('transkripOverlay');
  return el && el.style.display !== 'none';
}
function openTranskripOverlay(sid){
  const daftar = getDaftarSiswaTrx();
  if(sid && daftar.some(s=>s.id===sid)){
    currentSiswaTrx = sid;
  } else if(!currentSiswaTrx || !daftar.some(s=>s.id===currentSiswaTrx)){
    currentSiswaTrx = daftar[0]?.id || null;
  }
  document.getElementById('transkripOverlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
  const toolbarLogo = document.getElementById('toolbarP3DLogo');
  if (toolbarLogo) toolbarLogo.src = ICON_72;
  populateSiswaSelect();
  renderBook();
  setTimeout(rescalePages, 50);
}
function closeTranskripOverlay(){
  document.getElementById('transkripOverlay').style.display = 'none';
  document.body.style.overflow = '';
}

// Jika Dashboard Ustadz/ah menyimpan observasi baru (mis. dari tab lain via localStorage,
// atau dari menu Absen di halaman yang sama), transkrip ini otomatis re-render
// HANYA saat overlay sedang terbuka — tidak perlu refresh manual.
window.addEventListener('storage', function(e){
  if(e.key === 'p3d_observations_v1' && isTranskripOverlayOpen()){
    renderBook();
    setTimeout(rescalePages, 50);
  }
});
window.addEventListener('p3d:data-changed', function(){
  if(isTranskripOverlayOpen()){
    renderBook();
    setTimeout(rescalePages, 50);
  }
});
// Polling ringan sebagai cadangan, hanya aktif saat overlay terbuka (hemat resource saat tertutup)
let _lastDataSnapshot = '';
setInterval(function(){
  if(!isTranskripOverlayOpen()) return;
  try{
    const snap = localStorage.getItem('p3d_observations_v1') || '';
    if(snap !== _lastDataSnapshot){
      _lastDataSnapshot = snap;
      renderBook();
      setTimeout(rescalePages, 50);
    }
  }catch(e){}
}, 2000);
function scrollToPage(i){
  const pages=document.querySelectorAll('#transkripOverlay .page');
  if(pages[i]) pages[i].scrollIntoView({behavior:'smooth',block:'start'});
}
async function downloadPDF(){
  const btn = document.getElementById('btnDownload');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Memproses... (0/8)';
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'wait';

  // html2canvas tidak akurat men-capture elemen yang punya ancestor dengan CSS transform
  // (terutama di mobile, di mana .page-scale di-scale <1 agar pas di layar). Solusinya:
  // set transform ke scale(1) SEMENTARA hanya selama proses capture, lalu kembalikan
  // ke ukuran semula setelah selesai, agar tampilan layar tidak berubah permanen.
  const scaleEls = document.querySelectorAll('#transkripOverlay .page-scale');
  const wrapEls = document.querySelectorAll('#transkripOverlay .page-scale-wrap');
  const savedScaleTransform = Array.from(scaleEls).map(el=>el.style.transform);
  const savedWrapWidth = Array.from(wrapEls).map(el=>el.style.width);
  const savedWrapHeight = Array.from(wrapEls).map(el=>el.style.height);

  function setCaptureScale(){
    scaleEls.forEach(el=>{ el.style.transform = 'scale(1)'; });
    wrapEls.forEach(el=>{ el.style.width = '794px'; el.style.height = '1123px'; });
  }
  function restoreScale(){
    scaleEls.forEach((el,i)=>{ el.style.transform = savedScaleTransform[i]; });
    wrapEls.forEach((el,i)=>{ el.style.width = savedWrapWidth[i]; el.style.height = savedWrapHeight[i]; });
  }

  try{
    if(typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined'){
      throw new Error('Pustaka PDF (jsPDF/html2canvas) belum termuat. Pastikan perangkat terhubung internet saat pertama membuka halaman ini, lalu muat ulang.');
    }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const A4W = 210, A4H = 297;

    setCaptureScale();
    // Beri waktu browser memproses ulang layout setelah transform direset
    await new Promise(r=>setTimeout(r, 150));

    const pages = document.querySelectorAll('#transkripOverlay .page');
    for(let i=0; i<pages.length; i++){
      btn.innerHTML = `⏳ Memproses... (${i+1}/${pages.length})`;
      const canvas = await html2canvas(pages[i], {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        windowWidth: 794,
        width: 794,
        height: 1123,
      });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      if(i>0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, A4W, A4H, undefined, 'FAST');
    }

    const sw = getSiswaTrx(currentSiswaTrx);
    const namaFile = `Transkrip_P3D_${(sw.nama||'Santri').replace(/\s+/g,'_')}_${SEMESTER_AKTIF.label.replace(/\s+/g,'_')}_${SEMESTER_AKTIF.tahunAjaran.replace(/\//g,'-')}.pdf`;
    pdf.save(namaFile);
    btn.innerHTML = '✅ Berhasil Diunduh!';
    setTimeout(()=>{ btn.innerHTML = originalText; btn.disabled = false; btn.style.opacity=''; btn.style.cursor=''; }, 2500);
  } catch(err){
    console.error('Gagal membuat PDF:', err);
    alert('Terjadi kendala saat membuat PDF: ' + err.message + '\n\nSilakan coba lagi, atau gunakan tombol Cetak sebagai alternatif.');
    btn.innerHTML = originalText;
    btn.disabled = false;
    btn.style.opacity = '';
    btn.style.cursor = '';
  } finally {
    restoreScale();
  }
}
