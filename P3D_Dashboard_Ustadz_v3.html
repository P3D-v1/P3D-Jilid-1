  <style>

/* ── tokens.css ── */
:root {
  --hijau-tua: #0d2818;
  --hijau-tua-2: #163d22;
  --hijau-daun: #2f9e44;
  --hijau-daun-terang: #4caf50;
  --emas: #e8b923;
  --emas-terang: #f3cd4a;
  --hitam-logo: #0a1209;
  --status-hijau: #1f8a4c;
  --status-hijau-bg: #e7f6ec;
  --status-kuning: #c9870b;
  --status-kuning-bg: #fdf3dc;
  --status-merah: #c43d3d;
  --status-merah-bg: #fbe9e9;
  --kertas: #fbf9f4;
  --permukaan: #ffffff;
  --garis: #e4ddc9;
  --teks-utama: #1c2418;
  --teks-sekunder: #5b6259;
  --teks-muted: #8b9186;
  --font-display: 'Georgia', 'Noto Serif', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --shadow-card: 0 2px 10px rgba(13, 40, 24, 0.07);
  --shadow-elevated: 0 8px 28px rgba(13, 40, 24, 0.14);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --tinggi-topbar: 64px;
  --tinggi-bottomnav: 64px;
  --lebar-sidebar: 264px;
}

/* ── DARK MODE TOKENS ── */
[data-theme="dark"] {
  --hijau-tua: #0d2818;
  --hijau-tua-2: #163d22;
  --hijau-daun: #4caf50;
  --hijau-daun-terang: #6fcf73;
  --emas: #e8b923;
  --emas-terang: #f3cd4a;
  --status-hijau: #34d473;
  --status-hijau-bg: #0d2e1a;
  --status-kuning: #fbbf24;
  --status-kuning-bg: #2a1d00;
  --status-merah: #f87171;
  --status-merah-bg: #2a0a0a;
  --kertas: #111a13;
  --permukaan: #1a2b1c;
  --garis: #2a3d2c;
  --teks-utama: #e8f0e8;
  --teks-sekunder: #9ab89a;
  --teks-muted: #607060;
  --shadow-card: 0 2px 10px rgba(0,0,0,0.35);
  --shadow-elevated: 0 8px 28px rgba(0,0,0,0.5);
}

/* ── THEME TRANSITION (smooth switch) ── */
body, .card, .topbar, .sidebar, .bottom-nav, .metric-card, .siswa-row,
input, select, textarea, .btn, .badge, .toast, .select-field {
  transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease;
}

/* ── DARK MODE: input/select/textarea override ── */
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea {
  background: var(--permukaan) !important;
  color: var(--teks-utama) !important;
  border-color: var(--garis) !important;
}
[data-theme="dark"] input::placeholder,
[data-theme="dark"] textarea::placeholder {
  color: var(--teks-muted);
}
[data-theme="dark"] .sidebar {
  background: #142016;
  border-right-color: var(--garis);
}
[data-theme="dark"] .sidebar__nav-item {
  color: var(--teks-sekunder);
}
[data-theme="dark"] .sidebar__nav-item:hover {
  background: rgba(76,175,80,0.12);
  color: var(--emas-terang);
}
[data-theme="dark"] .sidebar__nav-item.is-active {
  background: var(--hijau-daun);
  color: #fff;
}
[data-theme="dark"] .bottom-nav {
  background: #142016;
  border-top-color: var(--garis);
}
[data-theme="dark"] .bottom-nav__item { color: var(--teks-muted); }
[data-theme="dark"] .bottom-nav__item.is-active { color: var(--hijau-daun); }
[data-theme="dark"] .divider { background: var(--garis); }

/* ── DARK MODE TOGGLE BUTTON in topbar ── */
#btn-theme-toggle {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 20px;
  padding: 5px 11px;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  flex-shrink: 0;
  transition: background 0.2s ease;
}
#btn-theme-toggle:hover { background: rgba(255,255,255,0.22); }

/* ── base.css ── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--kertas);
  color: var(--teks-utama);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0; font-weight: 700;
  color: var(--hijau-tua);
  letter-spacing: -0.01em;
}
p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
::selection { background: var(--emas-terang); color: var(--hijau-tua); }
:focus-visible { outline: 3px solid var(--emas); outline-offset: 2px; border-radius: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ── layout.css ── */
#app-root { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40;
  height: var(--tinggi-topbar);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-3); padding: 0 var(--space-4);
  background: var(--hijau-tua); color: #fff;
  box-shadow: 0 2px 12px rgba(13,40,24,0.18);
}
#app-root { padding-top: var(--tinggi-topbar); }
.topbar__brand { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.topbar__logo { width: 36px; height: 36px; flex-shrink: 0; }
.topbar__brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.topbar__brand-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--emas-terang); }
.topbar__brand-sub { font-size: 11px; color: #cfd8cb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar__user { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.topbar__avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--emas); color: var(--hijau-tua);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.app-body { display: flex; flex: 1; min-height: 0; }
.sidebar {
  display: none; flex-direction: column;
  width: var(--lebar-sidebar); flex-shrink: 0;
  background: var(--permukaan);
  border-right: 1px solid var(--garis);
  padding: var(--space-4) var(--space-3);
  gap: var(--space-1);
}
@media (min-width: 900px) {
  .sidebar { display: flex; }
  .bottom-nav { display: none !important; }
}
.sidebar__nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 11px var(--space-3); border-radius: var(--radius-sm);
  color: var(--teks-sekunder); font-size: 14px; font-weight: 500;
  background: none; border: none; width: 100%; text-align: left;
}
.sidebar__nav-item:hover { background: var(--status-hijau-bg); color: var(--hijau-tua); }
.sidebar__nav-item.is-active { background: var(--hijau-tua); color: var(--emas-terang); }
.sidebar__nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
.content {
  flex: 1; min-width: 0;
  padding: var(--space-4);
  padding-bottom: calc(var(--tinggi-bottomnav) + var(--space-5));
}
@media (min-width: 900px) {
  .content { padding: var(--space-6); padding-bottom: var(--space-6); }
}
.content__inner {
  max-width: 980px; margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--space-5);
}
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  height: var(--tinggi-bottomnav);
  background: var(--permukaan); border-top: 1px solid var(--garis);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav__item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; font-size: 10.5px;
  color: var(--teks-muted); font-weight: 500;
}
.bottom-nav__item.is-active { color: var(--hijau-daun); }
.bottom-nav__icon { font-size: 19px; }
.page-header {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: var(--space-3); flex-wrap: wrap;
}
.page-header__title { font-size: 21px; }
.page-header__subtitle { margin-top: 4px; color: var(--teks-sekunder); font-size: 13.5px; }
@media print {
  .topbar, .sidebar, .bottom-nav, .no-print { display: none !important; }
  .content { padding: 0; }
}

/* ── components.css ── */
.card {
  background: var(--permukaan); border-radius: var(--radius-md);
  border: 1px solid var(--garis); box-shadow: var(--shadow-card);
  padding: var(--space-4);
}
.card__title { font-size: 15px; font-weight: 700; color: var(--hijau-tua); margin-bottom: var(--space-3); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: var(--space-2); padding: 10px 18px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 600; border: 1px solid transparent;
  transition: filter 0.15s ease, transform 0.05s ease; white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn--primary { background: var(--hijau-tua); color: var(--emas-terang); }
.btn--primary:hover { filter: brightness(1.15); }
.btn--gold { background: var(--emas); color: var(--hijau-tua); }
.btn--gold:hover { filter: brightness(1.08); }
.btn--outline { background: transparent; border-color: var(--garis); color: var(--teks-utama); }
.btn--outline:hover { background: var(--status-hijau-bg); }
.btn--sm { padding: 6px 12px; font-size: 12.5px; }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
}
.badge--hijau { background: var(--status-hijau-bg); color: var(--status-hijau); }
.badge--kuning { background: var(--status-kuning-bg); color: var(--status-kuning); }
.badge--merah { background: var(--status-merah-bg); color: var(--status-merah); }
.badge--netral { background: #eee; color: var(--teks-sekunder); }
.opsi-group { display: flex; gap: 6px; flex-wrap: wrap; }
.opsi-btn {
  flex: 1; min-width: 44px; padding: 8px 6px;
  border-radius: var(--radius-sm); border: 1.5px solid var(--garis);
  background: var(--permukaan); font-size: 12px; font-weight: 700;
  color: var(--teks-sekunder); text-align: center;
}
.opsi-btn.is-selected.tone-hijau { background: var(--status-hijau-bg); border-color: var(--status-hijau); color: var(--status-hijau); }
.opsi-btn.is-selected.tone-kuning { background: var(--status-kuning-bg); border-color: var(--status-kuning); color: var(--status-kuning); }
.opsi-btn.is-selected.tone-merah { background: var(--status-merah-bg); border-color: var(--status-merah); color: var(--status-merah); }
.siswa-row {
  display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border: 1px solid var(--garis);
  border-radius: var(--radius-md); background: var(--permukaan);
}
.siswa-row__head { display: flex; align-items: center; gap: var(--space-3); }
.siswa-row__avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--status-hijau-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.siswa-row__nama { font-weight: 700; font-size: 14px; color: var(--teks-utama); }
.siswa-row__nisn { font-size: 11.5px; color: var(--teks-muted); }
.siswa-row__section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.04em; color: var(--teks-muted); margin-bottom: 6px;
}
.progress-track { height: 8px; border-radius: 999px; background: var(--garis); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--hijau-daun); transition: width 0.3s ease; }
.metric-card {
  display: flex; flex-direction: column; gap: 4px;
  padding: var(--space-4); border-radius: var(--radius-md);
  background: var(--permukaan); border: 1px solid var(--garis);
}
.metric-card__value { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--hijau-tua); }
.metric-card__label { font-size: 12px; color: var(--teks-sekunder); font-weight: 600; }
.metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
@media (min-width: 640px) { .metrics-grid { grid-template-columns: repeat(4, 1fr); } }
.toast {
  position: fixed; bottom: calc(var(--tinggi-bottomnav) + 16px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--hijau-tua); color: #fff; padding: 12px 18px;
  border-radius: var(--radius-md); box-shadow: var(--shadow-elevated);
  font-size: 13px; display: flex; align-items: center; gap: var(--space-2);
  z-index: 80; opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  max-width: calc(100vw - 32px);
}
@media (min-width: 900px) { .toast { bottom: 24px; } }
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast--error { background: var(--status-merah); }
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: var(--space-2);
  padding: var(--space-7) var(--space-4); color: var(--teks-muted);
}
.empty-state__icon { font-size: 34px; }
.select-field {
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--garis); background: var(--permukaan);
  font-size: 13.5px; color: var(--teks-utama); font-weight: 600;
}
.divider { height: 1px; background: var(--garis); border: none; margin: 0; }
  

/* ── Additional integration styles ── */
.btn--violet { background: #7c3aed; color: #fff; }
.btn--violet:hover { filter: brightness(1.12); }

/* ════════ CSS TRANSKRIP 8 HALAMAN (digabung dari file terpisah) ════════ */
#transkripOverlay, #transkripOverlay *{margin:0;padding:0;box-sizing:border-box;}
#transkripOverlay{font-family:'Plus Jakarta Sans',sans-serif;background:#e8ede8;color:#1a1a1a;}

/* ── CONTROLS ── */
.controls{position:fixed;top:0;left:0;right:0;z-index:100;background:#1a2e1a;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.3);flex-wrap:wrap;}
.controls h1{font-size:13px;font-weight:700;color:#a7f3d0;letter-spacing:.05em;}
.ctrl-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;flex-shrink:0;}
.ctrl-btn.primary{background:#10b981;color:#fff;}
.ctrl-btn.primary:hover{background:#059669;}
.ctrl-btn.secondary{background:rgba(255,255,255,.1);color:#d1fae5;border:1px solid rgba(255,255,255,.2);}
.ctrl-btn.secondary:hover{background:rgba(255,255,255,.2);}
.page-nav{display:flex;align-items:center;gap:6px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;}
.page-nav span{font-size:12px;color:#6ee7b7;font-weight:600;flex-shrink:0;}
.page-nav .ctrl-btn{padding:6px 10px;min-width:28px;}
.student-select{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;font-family:inherit;max-width:200px;}
.student-select option{color:#111;}

/* ── MOBILE: controls jadi 2 baris rapi, page-nav full width scrollable ── */
@media screen and (max-width:760px){
  .controls{padding:8px 10px;gap:8px;}
  .controls h1{display:none;}
  .ctrl-row1{display:flex;align-items:center;gap:8px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .ctrl-row1 .student-select{max-width:130px;flex-shrink:0;}
  .ctrl-row1 .ctrl-btn{flex-shrink:0;white-space:nowrap;}
  .page-nav{margin-left:0;width:100%;order:3;justify-content:flex-start;}
}

/* ── PAGE WRAPPER ── */
#transkripOverlay{overflow-x:hidden;}
.book{padding:70px 0 40px;display:flex;flex-direction:column;gap:0;align-items:center;width:100%;overflow-x:hidden;}
.page-scale-wrap{flex-shrink:0;margin:0 auto 24px;overflow:hidden;width:794px;height:1123px;}
.page-scale{width:794px;transform-origin:top left;}
.page{width:794px;min-height:1123px;max-height:1123px;background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.18);position:relative;overflow:hidden;page-break-after:always;}

/* ── MOBILE RESPONSIVE: scale halaman supaya pas di lebar layar, tidak terpotong ── */
@media screen and (max-width:840px){
  .book{padding:64px 0 24px;}
  .page-scale-wrap{margin:0 auto 16px;}
}

/* ── SHARED HEADER (halaman 2-8) ── */
.page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid #e5e7eb;background:#fff;}
.page-header-left{display:flex;align-items:center;gap:12px;}
.p3d-badge{width:40px;height:40px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #e5e7eb;overflow:hidden;}
.p3d-badge img{width:32px;height:32px;object-fit:contain;}
.header-text-main{font-size:11px;font-weight:700;color:#065f46;line-height:1.2;}
.header-text-sub{font-size:10px;color:#6b7280;line-height:1.2;}
.page-header-right{display:flex;align-items:center;gap:16px;}
.semester-badge{background:#065f46;color:#fff;padding:5px 14px;border-radius:6px;font-size:11px;font-weight:700;text-align:center;line-height:1.4;}
.page-num{font-size:12px;color:#6b7280;text-align:right;line-height:1.4;}

/* ── GREEN ACCENT DOTS ── */
.dot-pos{display:inline-block;width:10px;height:10px;border-radius:50%;background:#059669;flex-shrink:0;}
.dot-berk{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3b82f6;flex-shrink:0;}
.dot-cukup{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d97706;flex-shrink:0;}
.dot-perlu{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;flex-shrink:0;}

/* ── OBSERVASI TABLE ── */
.obs-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px;}
.obs-table th{background:#065f46;color:#fff;padding:8px 10px;text-align:left;font-weight:600;font-size:11px;}
.obs-table td{padding:7px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle;}
.obs-table tr:nth-child(even) td{background:#f9fafb;}
.ref-code{font-weight:700;font-size:11px;}
.domain-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;}
.arah-cell{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;}

/* ── DOMAIN SECTION HEADER ── */

<script>
/* ════════════════════════════════════════════════════════════════
   P3D Dashboard Ustadz/ah — Versi Terintegrasi
   Menggabungkan arsitektur bersih Dashboard Ustadz/ah (Repository/Service pattern)
   dengan P3D Engine sebagai satu sumber kebenaran observasi,
   dan Transkrip 8 Halaman yang terhubung langsung ke engine yang sama.
   ════════════════════════════════════════════════════════════════ */

// ── P3D ENGINE (sumber kebenaran tunggal untuk observasi & skor) ──
const P3D = (function(){

  const STORAGE_KEY = 'p3d_observations_v1';
  const META_KEY = 'p3d_meta_v1';

  // ── 1. SKALA RUBRIK (4=100, 3=85, 2=70, 1=50) ──
  const SKALA = {
    4: { label:'Sangat Berkembang', nilai:100, arah:'positif', dot:'dot-pos' },
    3: { label:'Berkembang Sesuai Harapan', nilai:85, arah:'berkembang', dot:'dot-berk' },
    2: { label:'Mulai Berkembang', nilai:70, arah:'cukup', dot:'dot-cukup' },
    1: { label:'Perlu Pendampingan', nilai:50, arah:'pendampingan', dot:'dot-perlu' },
  };
  // Mode cepat guru (1 klik A/B/C) dipetakan tegas ke skala 1-4
  const QUICK_MAP = { A:4, B:3, C:1 }; // A=Sangat Berkembang, B=Berkembang Sesuai Harapan, C=Perlu Pendampingan

  // ── 2. DOMAIN ──
  const DOMAINS = ['komunikasi','kolaborasi','kemandirian','ketangguhan','karakter'];
  const DOMAIN_INFO = {
    komunikasi:  { lbl:'Adab Berbicara & Sopan Santun', ico:'🗣️', color:'#2463eb', bg:'#dbeafe', code:'ABS' },
    kolaborasi:  { lbl:'Kerja Sama & Ukhuwah', ico:'🤝', color:'#065f46', bg:'#d1fae5', code:'KSU' },
    kemandirian: { lbl:'Kemandirian Ibadah & Belajar', ico:'🕌', color:'#6d28d9', bg:'#ede9fe', code:'KIB' },
    ketangguhan: { lbl:'Istiqamah & Semangat Belajar', ico:'🌱', color:'#92400e', bg:'#fef3c7', code:'ISB' },
    karakter:    { lbl:'Akhlak, Amanah & Disiplin Ibadah', ico:'💚', color:'#7e22ce', bg:'#fae8ff', code:'AAD' },
  };
  // Indikator per domain (untuk form observasi lengkap & rubrik)
  const INDIKATOR = {
    komunikasi: [
      {id:'bicara', label:'Berbicara dengan Sopan & Santun'},
      {id:'ide', label:'Adab kepada Ustadz/ah & Teman'},
      {id:'dengar', label:'Mendengarkan saat Ustadz/ah Mengajar'},
    ],
    kolaborasi: [
      {id:'kerjasama', label:'Kerja Sama dalam Kelompok Belajar'},
      {id:'kontribusi', label:'Menjaga Ukhuwah Islamiyah'},
      {id:'menghargai', label:'Menghargai Sesama Santri'},
    ],
    kemandirian: [
      {id:'inisiatif', label:'Mandiri Berwudhu & Bersuci'},
      {id:'tanggungjawab', label:'Mandiri Melaksanakan Salat'},
      {id:'manajemenwaktu', label:'Mandiri dalam Belajar & Murojaah'},
    ],
    ketangguhan: [
      {id:'pantangmenyerah', label:'Istiqamah Murojaah Harian'},
      {id:'strategi', label:'Semangat Mengulang & Memperbaiki Bacaan'},
      {id:'ketekunan', label:'Ketekunan Menyelesaikan Target Jilid'},
    ],
    karakter: [
      {id:'jujur', label:'Kejujuran & Amanah'},
      {id:'empati', label:'Akhlak Mulia terhadap Sesama'},
      {id:'disiplin', label:'Disiplin Ibadah & Tata Tertib Lembaga'},
    ],
  };

  // ── 3. STORAGE ──
  function _load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ console.error('P3D: gagal load storage', e); return {}; }
  }
  function _save(data){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      window.dispatchEvent(new CustomEvent('p3d:data-changed'));
      return true;
    }catch(e){ console.error('P3D: gagal simpan storage', e); return false; }
  }
  function getAll(){ return _load(); }
  function getForStudent(siswaId){ return _load()[siswaId] || []; }

  function nextId(siswaId, domain){
    const code = DOMAIN_INFO[domain]?.code || 'OBS';
    const list = getForStudent(siswaId).filter(o=>o.domain===domain);
    return `${code}${String(list.length+1).padStart(2,'0')}`;
  }

  /**
   * Menambahkan satu observasi (sumber kebenaran tunggal).
   * level: 1-4 (wajib, dasar seluruh rumus)
   */
  function addObservation({siswaId, kelas, semester, tanggal, guru, domain, indikatorId, level, catatan, konteks, bukti}){
    if(!siswaId || !domain || !level) throw new Error('siswaId, domain, dan level wajib diisi');
    if(!SKALA[level]) throw new Error('level harus 1-4');
    const data = _load();
    if(!data[siswaId]) data[siswaId] = [];
    const obs = {
      id: 'OBS-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      refCode: nextId(siswaId, domain),
      siswaId, kelas: kelas||'', semester: semester||'',
      tanggal: tanggal || new Date().toISOString().slice(0,10),
      guru: guru || '',
      domain, indikatorId: indikatorId || (INDIKATOR[domain]?.[0]?.id || ''),
      level: Number(level),
      catatan: catatan || '',
      konteks: konteks || '',
      bukti: bukti || '',
      createdAt: new Date().toISOString(),
    };
    data[siswaId].push(obs);
    _save(data);
    return obs;
  }

  function deleteObservation(siswaId, obsId){
    const data = _load();
    if(!data[siswaId]) return false;
    data[siswaId] = data[siswaId].filter(o=>o.id!==obsId);
    _save(data);
    return true;
  }

  function clearStudent(siswaId){
    const data = _load();
    delete data[siswaId];
    _save(data);
  }

  // ── 4. RUMUS SKOR (sesuai dokumen resmi, tidak ada angka manual) ──

  // Skor satu observasi (konversi level 1-4 → nilai 50/70/85/100)
  function nilaiObs(obs){ return SKALA[obs.level]?.nilai ?? null; }

  /**
   * Skor Indikator = (total nilai observasi indikator / (jumlah observasi x 4)) x 100
   * Catatan implementasi: rumus resmi P3D mengonversi setiap level observasi
   * ke nilai (4=100, 3=85, 2=70, 1=50) lebih dulu, baru dirata-rata. Ini identik
   * dengan rumus (total level/(n×4))×100 HANYA jika seluruh level sama; pada data
   * campuran, rata-rata nilai konversi adalah bentuk yang konsisten dengan tabel
   * skala resmi (contoh dokumen: 1 observasi level 3 = skor 85, bukan 75).
   * Maka digunakan: Skor Indikator = total nilai konversi / jumlah observasi.
   */
  function skorIndikator(observations){
    if(!observations.length) return null;
    const totalNilai = observations.reduce((a,o)=>a+(SKALA[o.level]?.nilai ?? 0),0);
    const skor = totalNilai / observations.length;
    return Math.round(skor*10)/10;
  }

  /** Mengelompokkan observasi siswa per domain per indikator */
  function groupByIndikator(obsList, domain){
    const filtered = obsList.filter(o=>o.domain===domain);
    const byInd = {};
    filtered.forEach(o=>{
      const k = o.indikatorId || '_umum';
      if(!byInd[k]) byInd[k] = [];
      byInd[k].push(o);
    });
    return byInd;
  }

  /** Skor Domain = rata-rata skor seluruh indikator dalam domain */
  function skorDomain(obsList, domain){
    const filtered = obsList.filter(o=>o.domain===domain);
    if(!filtered.length) return { skor:null, jumlahObs:0, indikatorSkor:{} };
    const byInd = groupByIndikator(obsList, domain);
    const indikatorSkor = {};
    const skorList = [];
    Object.keys(byInd).forEach(indId=>{
      const s = skorIndikator(byInd[indId]);
      indikatorSkor[indId] = { skor:s, jumlahObs: byInd[indId].length };
      if(s!==null) skorList.push(s);
    });
    const skor = skorList.length ? Math.round((skorList.reduce((a,b)=>a+b,0)/skorList.length)*10)/10 : null;
    return { skor, jumlahObs: filtered.length, indikatorSkor };
  }

  /** Rekap seluruh 5 domain untuk satu siswa */
  function rekapDomain(siswaId){
    const obsList = getForStudent(siswaId);
    const rekap = {};
    DOMAINS.forEach(d=>{ rekap[d] = skorDomain(obsList, d); });
    return rekap;
  }

  /** IPP = rata-rata skor 5 domain (hanya domain yang punya data) */
  function hitungIPP(siswaId){
    const rekap = rekapDomain(siswaId);
    const valid = DOMAINS.map(d=>rekap[d].skor).filter(s=>s!==null);
    if(!valid.length) return { ipp:null, kategori:'Data Belum Cukup', rekap };
    const ipp = Math.round((valid.reduce((a,b)=>a+b,0)/valid.length)*10)/10;
    return { ipp, kategori: kategoriSkor(ipp), rekap };
  }

  function kategoriSkor(skor){
    if(skor===null) return 'Data Belum Cukup';
    if(skor>=80) return 'Sangat Baik';
    if(skor>=70) return 'Baik';
    if(skor>=50) return 'Cukup';
    return 'Perlu Pendampingan';
  }
  function kategoriColor(kat){
    return {'Sangat Baik':'#059669','Baik':'#3b82f6','Cukup':'#d97706','Perlu Pendampingan':'#dc2626','Data Belum Cukup':'#94a3b8'}[kat] || '#94a3b8';
  }

  /**
   * Pertumbuhan Periode = skor periode akhir - skor periode awal.
   * Membagi observasi sebuah domain jadi 2 paruh berdasarkan tanggal,
   * lalu menghitung skor masing-masing paruh dengan rumus skor indikator/domain yang sama.
   */
  function pertumbuhanDomain(siswaId, domain){
    const obsList = getForStudent(siswaId).filter(o=>o.domain===domain).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    if(obsList.length < 2) return { p1:null, p2:null, delta:null, seriBulanan:[] };
    const mid = Math.ceil(obsList.length/2);
    const p1List = obsList.slice(0,mid);
    const p2List = obsList.slice(mid);
    const p1 = skorIndikator(p1List);
    const p2 = p2List.length ? skorIndikator(p2List) : null;
    const delta = (p1!==null && p2!==null) ? Math.round((p2-p1)*10)/10 : null;

    // Seri bulanan (rata-rata skor per bulan, untuk grafik)
    const byMonth = {};
    obsList.forEach(o=>{
      const m = o.tanggal.slice(0,7); // YYYY-MM
      if(!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(o);
    });
    const months = Object.keys(byMonth).sort();
    const seriBulanan = months.map(m=>({ bulan:m, skor: skorIndikator(byMonth[m]), n: byMonth[m].length }));

    return { p1, p2, delta, seriBulanan };
  }

  /** Jumlah Bukti = observasi valid (punya tanggal, guru, domain, indikator, catatan, bukti pendukung) */
  function jumlahBuktiValid(siswaId){
    const obsList = getForStudent(siswaId);
    return obsList.filter(o=>o.tanggal && o.guru && o.domain && o.indikatorId && o.catatan).length;
  }

  /** Ringkasan arah (positif/berkembang/cukup/pendampingan) untuk satu siswa, opsional per domain */
  function ringkasanArah(siswaId, domain){
    let obsList = getForStudent(siswaId);
    if(domain) obsList = obsList.filter(o=>o.domain===domain);
    const r = { positif:0, berkembang:0, cukup:0, pendampingan:0, total:obsList.length };
    obsList.forEach(o=>{
      const arah = SKALA[o.level]?.arah;
      if(arah) r[arah]++;
    });
    return r;
  }

  /** Domain terkuat & domain yang perlu dukungan, berbasis skor riil */
  function domainTerkuat(siswaId){
    const rekap = rekapDomain(siswaId);
    let best=null, bestScore=-1;
    DOMAINS.forEach(d=>{ if(rekap[d].skor!==null && rekap[d].skor>bestScore){ bestScore=rekap[d].skor; best=d; } });
    return best;
  }
  function domainPerluDukungan(siswaId){
    const rekap = rekapDomain(siswaId);
    return DOMAINS
      .filter(d=>rekap[d].skor!==null)
      .sort((a,b)=>rekap[a].skor-rekap[b].skor)
      .map(d=>({domain:d, skor:rekap[d].skor}));
  }

  // ── 5. GENERATOR NARASI (berbasis data, tidak ditulis manual) ──
  function generateNarasiDomain(siswaId, domain, namaSiswa){
    const obsList = getForStudent(siswaId).filter(o=>o.domain===domain).sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    const info = DOMAIN_INFO[domain];
    const nama = namaSiswa || 'Peserta didik';
    if(!obsList.length){
      return `${nama} belum memiliki data observasi pada domain ${info.lbl}. Narasi akan tersedia setelah ustadz/ah menginput observasi.`;
    }
    const { delta } = pertumbuhanDomain(siswaId, domain);
    const skorD = skorDomain(getForStudent(siswaId), domain).skor;
    const refs = obsList.map(o=>o.refCode);
    const refStr = refs.join(', ');
    // Ringkas: sebutkan maksimal 2 bukti representatif (observasi terbaru) agar narasi tetap padat 1 halaman
    const buktiRingkas = obsList.slice(-2).map(o=>`${o.catatan} (${o.refCode})`).join(' ');

    let kalimatArah;
    if(delta!==null && delta>0){
      kalimatArah = `${nama} menunjukkan perkembangan positif pada domain ${info.lbl}, dengan peningkatan skor sebesar ${delta>0?'+':''}${delta} poin dibandingkan periode sebelumnya.`;
    } else if(delta!==null && delta<0){
      kalimatArah = `${nama} membutuhkan pendampingan pada domain ${info.lbl}, karena skor menurun sebesar ${delta} poin dibandingkan periode sebelumnya.`;
    } else if(skorD!==null && skorD<70){
      kalimatArah = `${nama} membutuhkan pendampingan lebih lanjut pada domain ${info.lbl} agar dapat mencapai perkembangan yang sesuai harapan.`;
    } else {
      kalimatArah = `${nama} menunjukkan konsistensi pada domain ${info.lbl} berdasarkan ${obsList.length} observasi yang tercatat.`;
    }

    return `${kalimatArah} ${buktiRingkas} Catatan selengkapnya bersumber dari bukti observasi ${refStr}.`;
  }

  function generateRingkasanNarasi(siswaId, namaSiswa){
    const ipp = hitungIPP(siswaId);
    const nama = namaSiswa || 'Peserta didik';
    if(ipp.ipp===null) return `Data observasi ${nama} belum cukup untuk menyusun ringkasan narasi pertumbuhan.`;
    const terkuat = domainTerkuat(siswaId);
    const perlu = domainPerluDukungan(siswaId).filter(d=>d.skor<70);
    const terkuatLbl = terkuat ? DOMAIN_INFO[terkuat].lbl : '-';
    let kalimat = `${nama} menunjukkan IPP sebesar ${ipp.ipp} (${ipp.kategori}), dengan domain ${terkuatLbl} sebagai capaian terbaik.`;
    if(perlu.length){
      kalimat += ` Domain ${perlu.map(d=>DOMAIN_INFO[d.domain].lbl).join(', ')} masih membutuhkan pendampingan lebih lanjut.`;
    } else {
      kalimat += ` Seluruh domain menunjukkan perkembangan yang sesuai harapan atau lebih baik.`;
    }
    return kalimat;
  }

  // ── 6. VALIDASI KONSISTENSI ──
  function hasData(siswaId, domain){
    const obsList = getForStudent(siswaId);
    return domain ? obsList.some(o=>o.domain===domain) : obsList.length>0;
  }

  // ── 7. EXPORT/IMPORT (untuk sinkronisasi 2 file via file/clipboard jika perlu) ──
  function exportJSON(){ return JSON.stringify(_load()); }
  function importJSON(json){ _save(JSON.parse(json)); }

  return {
    SKALA, QUICK_MAP, DOMAINS, DOMAIN_INFO, INDIKATOR,
    addObservation, deleteObservation, clearStudent,
    getAll, getForStudent, nextId,
    nilaiObs, skorIndikator, skorDomain, rekapDomain, hitungIPP,
    kategoriSkor, kategoriColor, pertumbuhanDomain, jumlahBuktiValid,
    ringkasanArah, domainTerkuat, domainPerluDukungan,
    generateNarasiDomain, generateRingkasanNarasi, hasData,
    exportJSON, importJSON,
  };
})();

// ── domUtils ──
function escapeHTML(str) {
  if (str == null) return '';
  return String(str)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}
function qs(selector, root = document) { return root.querySelector(selector); }
function qsa(selector, root = document) { return Array.from(root.querySelectorAll(selector)); }
function delegate(container, eventType, selector, handler) {
  container.addEventListener(eventType, (event) => {
    const target = event.target.closest(selector);
    if (target && container.contains(target)) handler(event, target);
  });
}

// ── dateUtils ──
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function todayISO() { return toISODate(new Date()); }
function parseISODate(isoDate) {
  const [y,m,d] = isoDate.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatTanggalLengkap(isoDate) {
  const d = parseISODate(isoDate);
  return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
}
function formatTanggalSingkat(isoDate) {
  const d = parseISODate(isoDate);
  return `${d.getDate()} ${NAMA_BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}
function awalPekan(isoDate) {
  const d = parseISODate(isoDate);
  const hari = d.getDay();
  const offset = hari === 0 ? -6 : 1 - hari;
  d.setDate(d.getDate() + offset);
  return toISODate(d);
}
function rentangPekan(isoAwalPekan) {
  const d = parseISODate(isoAwalPekan);
  const hasil = [];
  for (let i = 0; i < 7; i++) {
    const next = new Date(d);
    next.setDate(d.getDate() + i);
    hasil.push(toISODate(next));
  }
  return hasil;
}

function getTemaHarian(date = new Date()) {
  const hari = date.getDay();
  const key = hari === 0 ? 7 : hari;
  return TEMA_HARIAN[key] || TEMA_HARIAN[1];
}

/** Kunci localStorage untuk tema observasi per kelas per tanggal */
function _temaKelasKey(kelasId, tanggal) {
  return `p3d_tema_kelas_${kelasId}_${tanggal}`;
}

/**
 * Ambil tema observasi untuk kelas tertentu hari ini.
 * Jika belum dipilih manual, fallback ke rotasi hari (getTemaHarian).
 */
function getTemaKelas(kelasId, tanggal) {
  tanggal = tanggal || todayISO();
  try {
    const raw = localStorage.getItem(_temaKelasKey(kelasId, tanggal));
    if (raw) {
      const id = parseInt(raw, 10);
      if (TEMA_HARIAN[id]) return { ...TEMA_HARIAN[id], _temaId: id, _diPilihManual: true };
    }
  } catch(e) {}
  const fallback = getTemaHarian(new Date());
  return { ...fallback, _diPilihManual: false };
}

/** Simpan pilihan tema untuk kelas tertentu hari ini */
function setTemaKelas(kelasId, temaId) {
  try {
    localStorage.setItem(_temaKelasKey(kelasId, todayISO()), String(temaId));
  } catch(e) {}
}

// ── LocalStorageProvider ──
class LocalStorageProvider {
  constructor(collectionKey) { this.collectionKey = collectionKey; }
  async readAll() {
    try {
      const raw = localStorage.getItem(this.collectionKey);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e) { return []; }
  }
  async writeAll(items) {
    try { localStorage.setItem(this.collectionKey, JSON.stringify(items)); return true; }
    catch(e) { return false; }
  }
  async seedIfEmpty(seedItems) {
    const existing = await this.readAll();
    if (existing.length === 0) { await this.writeAll(seedItems); return seedItems; }
    return existing;
  }
  async clear() { localStorage.removeItem(this.collectionKey); }
}

}

// ── Repositories ──
class SiswaRepository {
  constructor() { this.provider = new LocalStorageProvider('p3d_siswa_v1'); }
  async pastikanSeed() { await this.provider.seedIfEmpty(SEED_SISWA); }
  async getAll() { return (await this.provider.readAll()).map(Siswa.fromJSON); }
  async getById(id) { return (await this.getAll()).find(s => s.id === id) || null; }
  async getByKelas(kelasId) { return (await this.getAll()).filter(s => s.kelasId === kelasId); }
  async create(data) { const all = await this.provider.readAll(); const obj = new Siswa(data); all.push(obj.toJSON()); await this.provider.writeAll(all); return obj; }
  async update(id, partial) { const all = await this.provider.readAll(); const i = all.findIndex(s => s.id === id); if(i===-1) throw new Error('Not found'); all[i]={...all[i],...partial}; await this.provider.writeAll(all); return Siswa.fromJSON(all[i]); }
  async delete(id) { const all = await this.provider.readAll(); const f = all.filter(s => s.id !== id); await this.provider.writeAll(f); return f.length !== all.length; }
}

  constructor() { this.provider = new LocalStorageProvider('p3d_absen_v1'); }
  async getAll() { return (await this.provider.readAll()).map(Absen.fromJSON); }
  async getById(id) { return (await this.getAll()).find(a => a.id === id) || null; }
  async getByKelasTanggal(kelasId, tanggal) { return (await this.getAll()).filter(a => a.kelasId === kelasId && a.tanggal === tanggal); }
  async getBySiswa(siswaId) { return (await this.getAll()).filter(a => a.siswaId === siswaId); }
  async create(data) { const all = await this.provider.readAll(); const obj = new Absen(data); all.push(obj.toJSON()); await this.provider.writeAll(all); return obj; }
  async update(id, partial) { const all = await this.provider.readAll(); const i = all.findIndex(a => a.id === id); if(i===-1) throw new Error('Not found'); all[i]={...all[i],...partial}; await this.provider.writeAll(all); return Absen.fromJSON(all[i]); }
  async delete(id) { const all = await this.provider.readAll(); const f = all.filter(a => a.id !== id); await this.provider.writeAll(f); return f.length !== all.length; }
  async upsert({ siswaId, kelasId, tanggal, status }) {
    const id = Absen.buildId(kelasId, siswaId, tanggal);
    const all = await this.provider.readAll();
    const i = all.findIndex(a => a.id === id);
    const entitas = new Absen({ id, siswaId, kelasId, tanggal, status });
    if (i === -1) all.push(entitas.toJSON()); else all[i] = entitas.toJSON();
    await this.provider.writeAll(all);
    return entitas;
  }
}
class ObservasiRepository {
  // Menggunakan P3D Engine (p3d_observations_v1) sebagai backend penyimpanan.
  // Seluruh observasi disimpan dan dibaca lewat P3D.addObservation / P3D.getForStudent.
  // Ini memastikan Dashboard Ustadz/ah dan Transkrip 8 Halaman berbagi satu sumber kebenaran.
  _fromP3DFormat(p3dObs) {
    return Observasi.fromJSON({
      id: p3dObs.id, siswaId: p3dObs.siswaId, kelasId: p3dObs.kelas,
      tanggal: p3dObs.tanggal, domain: p3dObs.domain, indikatorId: p3dObs.indikatorId,
      level: p3dObs.level, catatan: p3dObs.catatan, konteks: p3dObs.konteks,
      guru: p3dObs.guru, semester: p3dObs.semester, createdAt: p3dObs.createdAt,
    });
  }
  async getAll() {
    const allData = P3D.getAll();
    const result = [];
    Object.values(allData).forEach(list => list.forEach(o => result.push(this._fromP3DFormat(o))));
    return result;
  }
  async getById(id) { return (await this.getAll()).find(o => o.id === id) || null; }
  async getBySiswa(siswaId) {
    return P3D.getForStudent(siswaId).map(o => this._fromP3DFormat(o));
  }
  async getBySiswaTanggal(siswaId, tanggal) {
    return (await this.getBySiswa(siswaId)).filter(o => o.tanggal === tanggal);
  }
  async getByKelasTanggal(kelasId, tanggal) {
    return (await this.getAll()).filter(o => o.kelasId === kelasId && o.tanggal === tanggal);
  }
  async create(data) {
    const obs = P3D.addObservation({
      siswaId: data.siswaId, kelas: data.kelasId, semester: data.semester || '',
      tanggal: data.tanggal, guru: data.guru || '',
      domain: data.domain, indikatorId: data.indikatorId,
      level: data.level, catatan: data.catatan || '',
      konteks: data.konteks || '', bukti: data.bukti || '',
    });
    return this._fromP3DFormat(obs);
  }
  async update(id, partial) {
    // P3D Engine tidak mendukung update langsung; delete + recreate
    const existing = await this.getById(id);
    if(!existing) throw new Error('Not found');
    P3D.deleteObservation(existing.siswaId, id);
    return this.create({ ...existing, ...partial });
  }
  async delete(id) {
    const existing = await this.getById(id);
    if(!existing) return false;
    return P3D.deleteObservation(existing.siswaId, id);
  }
  async deleteBySiswaTanggal(siswaId, tanggal) {
    const toDelete = await this.getBySiswaTanggal(siswaId, tanggal);
    toDelete.forEach(o => P3D.deleteObservation(siswaId, o.id));
    return toDelete.length;
  }
}

class P3DScoringService {
  // Mendelegasikan ke P3D Engine untuk konsistensi rumus dengan Transkrip 8 Halaman.
  constructor(observasiRepository) { this.observasiRepository = observasiRepository; }
  nilaiDariLevel(level) { return P3D.SKALA[level]?.nilai ?? null; }
  kategoriSkor(skor) { return P3D.kategoriSkor(skor) || 'Belum Ada Data'; }
  skorDomain(observasiList, domain) {
    // observasiList sudah berisi data dari P3D engine (via ObservasiRepository).
    // Gunakan rumus P3D.skorIndikator yang konsisten.
    const relevan = observasiList.filter(o => o.domain === domain);
    if (!relevan.length) return null;
    const result = P3D.skorDomain(relevan, domain);
    return result.skor;
  }
  _rataNilai(list) {
    if (!list.length) return 0;
    return list.reduce((sum, o) => sum + (this.nilaiDariLevel(o.level) || 0), 0) / list.length;
  }
}

class AbsenObservasiService {
  constructor(absenRepository, observasiRepository, siswaRepository) {
    this.absenRepository = absenRepository;
    this.observasiRepository = observasiRepository;
    this.siswaRepository = siswaRepository;
  }
  getTemaHariIni() { return getTemaHarian(new Date()); }
  getTemaUntukKelas(kelasId) { return getTemaKelas(kelasId); }
  async getDaftarSiswaDenganStatusHariIni(kelasId) {
    const tanggal = todayISO();
    const [siswaList, absenHariIni, observasiHariIni] = await Promise.all([
      this.siswaRepository.getByKelas(kelasId),
      this.absenRepository.getByKelasTanggal(kelasId, tanggal),
      this.observasiRepository.getByKelasTanggal(kelasId, tanggal),
    ]);
    return siswaList.map(siswa => {
      const absen = absenHariIni.find(a => a.siswaId === siswa.id);
      const obs = observasiHariIni.find(o => o.siswaId === siswa.id);
      return { siswa, statusHadir: absen ? absen.status : null, opsiObservasi: obs ? this._levelToOpsiId(obs.level, kelasId) : null };
    });
  }
  async setKehadiran(kelasId, siswaId, statusHadir) {
    return this.absenRepository.upsert({ siswaId, kelasId, tanggal: todayISO(), status: statusHadir });
  }
  async setObservasiCepat(kelasId, siswaId, namaGuru, semester, opsiId) {
    const tema = this.getTemaUntukKelas(kelasId);
    const opsi = tema.opsi.find(o => o.id === opsiId);
    if (!opsi) throw new Error(`Opsi "${opsiId}" tidak dikenali.`);
    const tanggal = todayISO();
    await this.observasiRepository.deleteBySiswaTanggal(siswaId, tanggal);
    return this.observasiRepository.create({ siswaId, kelasId, tanggal, domain: tema.domain, indikatorId: tema.indikatorId, level: opsi.level, catatan: `${opsi.label} (observasi kelas — ${tema.label})`, konteks: 'Kegiatan Pembelajaran Harian', guru: namaGuru, semester });
  }
  async ringkasanKehadiran(kelasId) {
    const tanggal = todayISO();
    const siswaList = await this.siswaRepository.getByKelas(kelasId);
    const absenHariIni = await this.absenRepository.getByKelasTanggal(kelasId, tanggal);
    const hitung = { H:0, S:0, I:0, A:0, belumDiisi:0 };
    siswaList.forEach(siswa => {
      const absen = absenHariIni.find(a => a.siswaId === siswa.id);
      if (absen) hitung[absen.status] = (hitung[absen.status] || 0) + 1;
      else hitung.belumDiisi += 1;
    });
    return { ...hitung, total: siswaList.length };
  }
  _levelToOpsiId(level, kelasId) {
    const tema = kelasId ? this.getTemaUntukKelas(kelasId) : this.getTemaHariIni();
    const opsi = tema.opsi.find(o => o.level === level);
    return opsi ? opsi.id : null;
  }
}

class RekapMingguanService {
  constructor(absenRepository, observasiRepository, siswaRepository, scoringService) {
    this.absenRepository = absenRepository;
    this.observasiRepository = observasiRepository;
    this.siswaRepository = siswaRepository;
    this.scoringService = scoringService;
  }
  getRentangPekanIni() { return rentangPekan(awalPekan(todayISO())); }
  async rekapKelas(kelasId, tanggalPekan) {
    if (!tanggalPekan) tanggalPekan = this.getRentangPekanIni();
    const siswaList = await this.siswaRepository.getByKelas(kelasId);
    const hasil = [];
    for (const siswa of siswaList) {
      const absenSiswa = (await this.absenRepository.getBySiswa(siswa.id)).filter(a => tanggalPekan.includes(a.tanggal));
      const observasiSiswa = (await this.observasiRepository.getBySiswa(siswa.id)).filter(o => tanggalPekan.includes(o.tanggal));
      const kehadiran = { H:0, S:0, I:0, A:0 };
      absenSiswa.forEach(a => { kehadiran[a.status] = (kehadiran[a.status] || 0) + 1; });
      const skorPerDomain = {};
      DOMAIN_KEYS.forEach(domain => { skorPerDomain[domain] = this.scoringService.skorDomain(observasiSiswa, domain); });
      const skorValid = Object.values(skorPerDomain).filter(s => s != null);
      const skorRataRata = skorValid.length ? Math.round(skorValid.reduce((a,b) => a+b, 0) / skorValid.length) : null;
      hasil.push({ siswa, kehadiran, skorPerDomain, skorRataRata, jumlahObservasi: observasiSiswa.length, perluPerhatian: kehadiran.A >= 2 || (skorRataRata != null && skorRataRata < 65) });
    }
    return hasil;
  }
  filterEarlyWarning(rekapKelas) { return rekapKelas.filter(item => item.perluPerhatian); }
}

class CetakHarianService {
  constructor(absenObservasiService, kelasRepository) {
    this.absenObservasiService = absenObservasiService;
    this.kelasRepository = kelasRepository;
  }
  async siapkanDataLembarHarian(kelasId) {
    const kelas = await this.kelasRepository.getById(kelasId);
    const daftarSiswa = await this.absenObservasiService.getDaftarSiswaDenganStatusHariIni(kelasId);
    const ringkasanKehadiran = await this.absenObservasiService.ringkasanKehadiran(kelasId);
    const tema = this.absenObservasiService.getTemaUntukKelas(kelasId);
    return { namaSekolah: IDENTITAS_SEKOLAH.nama, semester: IDENTITAS_SEKOLAH.semesterAktif, tanggalFormat: formatTanggalLengkap(todayISO()), kelas, tema: { ...tema, domainInfo: DOMAIN_INFO[tema.domain] }, daftarSiswa, ringkasanKehadiran };
  }
}

let _toastEl = null, _hideTimeout = null;
function showToast(message, type='success') {
  if (!_toastEl) {
    _toastEl = document.createElement('div');
    _toastEl.className = 'toast';
    _toastEl.setAttribute('role','status');
    _toastEl.setAttribute('aria-live','polite');
    document.body.appendChild(_toastEl);
  }
  _toastEl.textContent = message;
  _toastEl.className = `toast is-visible${type==='error'?' toast--error':''}`;
  clearTimeout(_hideTimeout);
  _hideTimeout = setTimeout(() => _toastEl.classList.remove('is-visible'), 2600);
}

  constructor({ cetakHarianService, kelasRepository, kelasAktifId, onKelasAktifBerubah }) {

  }
  async render(container) {
    this.container = container;
    this.kelasAktifId = loadKelasAktif() || this.kelasAktifId;
    const data = await this.cetakHarianService.siapkanDataLembarHarian(this.kelasAktifId);
    const semuaKelas = await this.kelasRepository.getAll();
    container.innerHTML = `
      <div class="page-header no-print">
        <div>
          <h1 class="page-header__title">Cetak Lembar Harian</h1>
          <p class="page-header__subtitle">Pratinjau lembar absen &amp; observasi sebelum dicetak.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select class="select-field" id="pilih-kelas-cetak" aria-label="Pilih kelas">
            ${semuaKelas.map(k => `<option value="${escapeHTML(k.id)}"${k.id===this.kelasAktifId?' selected':''}>${escapeHTML(k.id)}</option>`).join('')}
          </select>
          <button class="btn btn--primary" id="btn-cetak">🖨️ Cetak</button>
          <button class="btn btn--gold" id="btn-unduh-harian">⬇️ Unduh PDF</button>
        </div>
      </div>
      <div class="card" id="lembar-preview" style="background:#fff">${this._buildLembarHTML(data)}</div>`;
    qs('#pilih-kelas-cetak', container).addEventListener('change', async (e) => {
      this.kelasAktifId = e.target.value;
      this.onKelasAktifBerubah(this.kelasAktifId);
      await this.render(this.container);
    });
    qs('#btn-cetak', container).addEventListener('click', () => window.print());
    qs('#btn-unduh-harian', container).addEventListener('click', async () => {
      const btn = qs('#btn-unduh-harian', container);
      const orig = btn.innerHTML;
      try {
        if (typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined') {
          alert('Pustaka PDF belum termuat. Pastikan terhubung ke internet lalu muat ulang halaman.');
          return;
        }
        btn.innerHTML = '⏳ Memproses...'; btn.disabled = true;
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4', compress:true });
        const el = document.getElementById('lembar-preview');
        const canvas = await html2canvas(el, { scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const A4W=210, A4H=297;
        const ratio = canvas.height / canvas.width;
        const imgH = Math.min(A4H, A4W * ratio);
        pdf.addImage(imgData,'JPEG',0,0,A4W,imgH,undefined,'FAST');
        const { namaSekolah, tanggalFormat, kelas } = await this.cetakHarianService.siapkanDataLembarHarian(this.kelasAktifId);
        pdf.save(`Lembar_Harian_${(kelas?.id||'').replace(/\s/g,'_')}_${tanggalFormat.replace(/\s/g,'_')}.pdf`);
        btn.innerHTML = '✅ Berhasil!';
        setTimeout(()=>{ btn.innerHTML=orig; btn.disabled=false; }, 2500);
      } catch(err) {
        alert('Gagal membuat PDF: ' + err.message);
        btn.innerHTML = orig; btn.disabled = false;
      }
    });
  }
  _buildLembarHTML(data) {
    const { namaSekolah, semester, tanggalFormat, kelas, tema, daftarSiswa, ringkasanKehadiran } = data;

    return `

        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;text-align:center;">

          <div>
            <h2 style="margin:0;font-size:17px">${escapeHTML(namaSekolah)}</h2>

        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap;gap:6px">
          <span><strong>Kelas:</strong> ${escapeHTML(kelas?kelas.id:'')}</span>

        </div>
        <p style="font-size:12.5px;margin-bottom:10px">
          <strong>Tema Observasi:</strong> ${domainInfo.ikon} ${escapeHTML(domainInfo.label)} — ${escapeHTML(tema.label)}
        </p>
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px">
          <thead>
            <tr style="background:#f3f1e7;text-align:left">

              style="width:100%;padding:10px 12px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;margin-bottom:10px;" placeholder="Contoh: Drs. Ahmad Fauzi, M.Pd." />
            <div class="siswa-row__section-label" style="margin-bottom:6px;">NIP / Nomor Identitas Kepala Lembaga (opsional)</div>
            <input id="input-nip-kepala-yayasan" type="text" value="${escapeHTML(settings.sekolah.nipKepalaYayasan||'')}"
              style="width:100%;padding:10px 12px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;" placeholder="Contoh: NIP. 19750210 200312 1 003" />
          </div>
          <div style="border-top:1px dashed var(--garis);padding-top:12px;margin-top:2px;">
            <div class="siswa-row__section-label" style="margin-bottom:6px;">Logo Lembaga / Yayasan <span style="font-weight:400;text-transform:none;color:var(--teks-muted);">(tampil di bagian atas cover transkrip)</span></div>
            <!-- Preview area -->
            <div id="logo-tpa-preview-wrap" style="display:flex;align-items:center;gap:14px;padding:14px;border:1.5px dashed var(--garis);border-radius:var(--radius-md);background:var(--kertas);margin-bottom:10px;">
              <div id="logo-tpa-preview" style="width:80px;height:80px;border-radius:12px;border:2px solid var(--garis);background:var(--permukaan);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">
                ${settings.sekolah.logoTPA
                  ? `<img src="${settings.sekolah.logoTPA}" style="width:100%;height:100%;object-fit:contain;" />`
                  : `<span style="font-size:30px;opacity:.35;">🏫</span>`}
              </div>
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:700;color:var(--teks-utama);margin-bottom:3px;" id="logo-tpa-nama-file">${settings.sekolah.logoTPA ? 'Logo terpasang ✓' : 'Belum ada logo'}</div>
                <div style="font-size:11.5px;color:var(--teks-muted);line-height:1.5;">Format: JPG, PNG, SVG, WebP. Maks 2 MB.<br>Disarankan: persegi (1:1), background transparan.</div>
              </div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <label for="input-logo-tpa" class="btn btn--outline btn--sm" style="cursor:pointer;">📁 Pilih File Logo</label>
              <input type="file" id="input-logo-tpa" accept="image/*" style="display:none;" />
              <button class="btn btn--outline btn--sm" id="btn-hapus-logo-tpa" style="color:var(--status-merah);border-color:var(--status-merah);${settings.sekolah.logoTPA?'':'display:none;'}">🗑 Hapus Logo</button>
            </div>
          </div>
          <button class="btn btn--primary" id="btn-simpan-sekolah">💾 Simpan Identitas Lembaga</button>
        </div>
      </div>

      <!-- PROFIL USTADZ/AH YANG LOGIN (tidak terikat ke kelas manapun) -->
      <div class="card">
        <div class="card__title">👤 Profil Ustadz/ah (Akun yang Login)</div>
        <p style="font-size:12px;color:var(--teks-muted);margin:-4px 0 10px;">Nama ini hanya tampil di pojok kanan atas dashboard. Tidak memengaruhi data wali kelas mana pun di bawah.</p>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <div class="siswa-row__section-label" style="margin-bottom:6px;">Nama Ustadz/Ustadzah yang Login</div>
            <input id="input-nama-guru" type="text" value="${escapeHTML(settings.guru.nama)}"
              style="width:100%;padding:10px 12px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;" placeholder="Contoh: Ustadzah Sari Wulandari, S.Pd." />
          </div>
          <button class="btn btn--primary" id="btn-simpan-guru">💾 Simpan Profil Login</button>
        </div>
      </div>

      <!-- WALI KELAS PER JILID — sumber tunggal nama wali tiap kelas, dipakai di Absen/Cetak/Transkrip & tanda tangan -->
      <div class="card">
        <div class="card__title">🏷️ Wali Kelas per Jilid</div>
        <p style="font-size:12px;color:var(--teks-muted);margin:-4px 0 10px;">Ini data resmi wali tiap kelas — dipakai untuk tanda tangan di Cetak Harian &amp; Transkrip. Ketuk "Ubah" untuk mengganti wali satu kelas tanpa memengaruhi kelas lain.</p>
        <div id="area-wali-kelas" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

      <!-- KELOLA SISWA PER KELAS -->
      <div class="card">
        <div class="card__title">📋 Kelola Daftar Santri</div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
          <select id="pilih-kelas-siswa" class="select-field">
            ${semuaKelas.map(k=>`<option value="${escapeHTML(k.id)}">${escapeHTML(k.id)}</option>`).join('')}
          </select>
          <span style="font-size:13px;color:var(--teks-muted);">Pilih kelas/jilid untuk kelola santri</span>
        </div>
        <div id="area-kelola-siswa"></div>
      </div>

      <!-- ════ BACKUP & RESTORE DATA ════ -->
      <div class="card" style="border-color:var(--hijau-daun);">
        <div class="card__title">💾 Backup &amp; Restore Data</div>
        <p style="font-size:12px;color:var(--teks-muted);margin:-4px 0 16px;line-height:1.6;">
          Seluruh data aplikasi (santri, kelas, absensi, observasi, pengaturan) dapat disimpan ke file JSON dan dikembalikan kapan saja.
          Lakukan backup rutin minimal 1× seminggu, terutama sebelum mengganti HP.
        </p>

        <!-- Backup -->
        <div style="border:1.5px solid var(--garis);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:12px;background:var(--kertas);">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <span style="font-size:22px;">⬇️</span>
            <div>
              <div style="font-weight:700;font-size:14px;color:var(--teks-utama);">Backup Semua Data ke File JSON</div>
              <div style="font-size:11.5px;color:var(--teks-muted);">File akan otomatis tersimpan di folder Unduhan HP Anda.</div>
            </div>
          </div>
          <div id="backup-info" style="font-size:12px;color:var(--teks-sekunder);margin-bottom:10px;padding:8px 10px;background:var(--status-hijau-bg);border-radius:var(--radius-sm);display:none;"></div>
          <button class="btn btn--primary btn--block" id="btn-backup-json" style="gap:8px;">
            ⬇️ Unduh Backup JSON Sekarang
          </button>
        </div>

        <!-- Restore -->
        <div style="border:1.5px solid var(--garis);border-radius:var(--radius-sm);padding:14px 16px;background:var(--kertas);">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <span style="font-size:22px;">⬆️</span>
            <div>
              <div style="font-weight:700;font-size:14px;color:var(--teks-utama);">Restore Data dari File Backup</div>
              <div style="font-size:11.5px;color:var(--teks-muted);">Pilih file <code style="background:var(--garis);padding:1px 5px;border-radius:4px;font-size:11px;">.json</code> yang sebelumnya dibuat dari tombol Backup di atas.</div>
            </div>
          </div>
          <div id="restore-preview" style="display:none;margin-bottom:10px;padding:10px 12px;border:1.5px solid var(--emas);border-radius:var(--radius-sm);background:var(--status-kuning-bg);font-size:12px;line-height:1.7;"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <label for="input-restore-json" class="btn btn--outline" style="cursor:pointer;flex:1;justify-content:center;">
              📂 Pilih File Backup (.json)
            </label>
            <input type="file" id="input-restore-json" accept=".json,application/json" style="display:none;" />
            <button class="btn btn--gold" id="btn-restore-json" style="flex:1;display:none;">
              ✅ Terapkan Restore
            </button>
          </div>
          <p style="font-size:11px;color:var(--status-merah);margin-top:8px;">
            ⚠️ Restore akan <strong>mengganti seluruh data</strong> yang ada di HP ini dengan data dari file backup.
            Pastikan Anda memilih file yang benar.
          </p>
        </div>
      </div>

      <!-- ════ SOP SINKRONISASI / HP BARU ════ -->
      <div class="card" style="border-color:var(--emas);">
        <div class="card__title">📱 SOP: Pindah HP atau HP Rusak</div>
        <p style="font-size:12px;color:var(--teks-muted);margin:-4px 0 14px;line-height:1.6;">
          Ikuti langkah-langkah berikut agar data santri dan observasi Anda tidak hilang saat berganti perangkat.
        </p>

        <div style="display:flex;flex-direction:column;gap:10px;">

          <!-- Langkah 1 -->
          <div style="display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--status-hijau-bg);border:1px solid var(--status-hijau);">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--status-hijau);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;">1</div>
            <div>
              <div style="font-weight:700;font-size:13px;color:var(--teks-utama);margin-bottom:3px;">Di HP Lama — Lakukan Backup</div>
              <div style="font-size:12px;color:var(--teks-sekunder);line-height:1.6;">
                Buka halaman <strong>Pengaturan → Backup &amp; Restore</strong>, lalu klik
                <strong>"Unduh Backup JSON Sekarang"</strong>. File akan tersimpan otomatis
                ke folder <strong>Unduhan</strong> HP Anda dengan nama seperti
                <code style="background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-size:11px;">P3D_Backup_Lembaga_2026-06-29.json</code>.
              </div>
            </div>
          </div>

          <!-- Langkah 2 -->
          <div style="display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--status-kuning-bg);border:1px solid var(--status-kuning);">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--status-kuning);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;">2</div>
            <div>
              <div style="font-weight:700;font-size:13px;color:var(--teks-utama);margin-bottom:3px;">Pindahkan File JSON ke HP Baru</div>
              <div style="font-size:12px;color:var(--teks-sekunder);line-height:1.6;">
                Kirimkan file backup <code style="background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px;font-size:11px;">.json</code> ke HP baru menggunakan salah satu cara:
                <ul style="margin:5px 0 0 16px;padding:0;">
                  <li>📲 <strong>WhatsApp</strong> — kirim ke diri sendiri (Saved Messages)</li>
                  <li>☁️ <strong>Google Drive / Dropbox</strong> — upload lalu download di HP baru</li>
                  <li>📧 <strong>Email</strong> — kirim ke email sendiri sebagai lampiran</li>
                  <li>🔗 <strong>Kabel USB</strong> — salin langsung antar perangkat</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Langkah 3 -->
          <div style="display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--kertas);border:1px solid var(--garis);">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--hijau-tua);color:var(--emas-terang);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;">3</div>
            <div>
              <div style="font-weight:700;font-size:13px;color:var(--teks-utama);margin-bottom:3px;">Di HP Baru — Buka Aplikasi P3D</div>
              <div style="font-size:12px;color:var(--teks-sekunder);line-height:1.6;">
                Salin file HTML aplikasi ini ke HP baru (via WhatsApp, Drive, atau kabel USB).
                Buka file HTML di browser HP baru, lalu pastikan aplikasi terbuka dengan tampilan kosong atau data awal.
              </div>
            </div>
          </div>

          <!-- Langkah 4 -->
          <div style="display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--status-hijau-bg);border:1.5px solid var(--status-hijau);">
            <div style="width:30px;height:30px;border-radius:50%;background:var(--hijau-daun);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;">4</div>
            <div>
              <div style="font-weight:700;font-size:13px;color:var(--teks-utama);margin-bottom:3px;">Di HP Baru — Restore Data</div>
              <div style="font-size:12px;color:var(--teks-sekunder);line-height:1.6;">
                Di HP baru, buka halaman <strong>Pengaturan → Backup &amp; Restore</strong>, klik
                <strong>"Pilih File Backup (.json)"</strong>, pilih file yang sudah dipindahkan,
                lalu klik <strong>"Terapkan Restore"</strong>. Semua data santri, observasi,
                dan pengaturan akan kembali seperti semula. ✅
              </div>
            </div>
          </div>

        </div>

        <!-- Tips penting -->
        <div style="margin-top:14px;padding:12px 14px;background:var(--permukaan);border-radius:var(--radius-sm);border:1px dashed var(--emas);">
          <div style="font-size:12px;font-weight:700;color:var(--status-kuning);margin-bottom:6px;">💡 Tips Penting</div>
          <ul style="margin:0;padding-left:16px;font-size:12px;color:var(--teks-sekunder);line-height:1.8;">
            <li>Lakukan backup <strong>minimal 1× seminggu</strong>, atau setelah entri observasi banyak.</li>
            <li>Simpan file backup di <strong>Google Drive / cloud</strong> agar tidak ikut hilang jika HP rusak total.</li>
            <li>File backup aman karena hanya berisi data teks biasa (JSON), tidak ada password yang tersimpan.</li>
            <li>Anda bisa membuka file backup di laptop/PC untuk memverifikasi isinya sewaktu-waktu.</li>
          </ul>
        </div>
      </div>
    `;

    // Simpan identitas sekolah
    document.getElementById('btn-simpan-sekolah').addEventListener('click', () => {
      const nama = document.getElementById('input-nama-sekolah').value.trim();
      const sem = document.getElementById('input-semester').value;
      const kepalaYayasan = document.getElementById('input-kepala-yayasan').value.trim();
      const nipKepalaYayasan = document.getElementById('input-nip-kepala-yayasan').value.trim();
      if (!nama) { showToast('Nama lembaga tidak boleh kosong.','error'); return; }
      const s = loadSettings();
      // logoTPA sudah tersimpan sementara di _pendingLogoTPA (atau tetap yang lama)
      const logoTPA = (typeof this._pendingLogoTPA !== 'undefined') ? this._pendingLogoTPA : (s.sekolah.logoTPA || '');
      saveSettings({ ...s.sekolah, nama, semesterAktif: sem, kepalaYayasan, nipKepalaYayasan, logoTPA }, s.guru);
      delete this._pendingLogoTPA;
      showToast('Identitas lembaga berhasil disimpan! Muat ulang untuk melihat perubahan di header.');
      this.render(this.container);
    });

    // Upload logo lembaga
    const inputLogo = document.getElementById('input-logo-tpa');
    if (inputLogo) {
      inputLogo.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) { showToast('Ukuran file melebihi 2 MB. Pilih gambar yang lebih kecil.', 'error'); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          this._pendingLogoTPA = dataUrl;
          // Update preview
          const previewEl = document.getElementById('logo-tpa-preview');
          const namaEl = document.getElementById('logo-tpa-nama-file');
          const hapusBtn = document.getElementById('btn-hapus-logo-tpa');
          if (previewEl) previewEl.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;" />`;
          if (namaEl) namaEl.textContent = file.name + ' (belum disimpan)';
          if (hapusBtn) hapusBtn.style.display = '';
          showToast('Logo dipilih. Klik "Simpan Identitas Lembaga" untuk menyimpan.');
        };
        reader.readAsDataURL(file);
      });
    }
    // Hapus logo lembaga
    const hapusLogoBtn = document.getElementById('btn-hapus-logo-tpa');
    if (hapusLogoBtn) {
      hapusLogoBtn.addEventListener('click', () => {
        this._pendingLogoTPA = '';
        const previewEl = document.getElementById('logo-tpa-preview');
        const namaEl = document.getElementById('logo-tpa-nama-file');
        if (previewEl) previewEl.innerHTML = `<span style="font-size:30px;opacity:.35;">🏫</span>`;
        if (namaEl) namaEl.textContent = 'Logo dihapus (belum disimpan)';
        hapusLogoBtn.style.display = 'none';
        showToast('Logo akan dihapus saat Anda menekan Simpan.');
      });
    }

    // Simpan profil ustadz/ah yang login (terpisah total dari data wali kelas)
    document.getElementById('btn-simpan-guru').addEventListener('click', () => {
      const namaGuru = document.getElementById('input-nama-guru').value.trim();
      if (!namaGuru) { showToast('Nama ustadz/ah tidak boleh kosong.','error'); return; }
      const inisial = namaGuru.split(/[\s,.]+/).filter(w=>/[A-Z]/.test(w[0]||'')).map(w=>w[0]).slice(0,2).join('') || namaGuru.slice(0,2).toUpperCase();
      const s = loadSettings();
      saveSettings(s.sekolah, { nama: namaGuru, inisial });
      showToast('Profil login berhasil disimpan! Muat ulang untuk melihat perubahan di header.');
      this.render(this.container);
    });

    // Toggle dark mode dari pengaturan
    const toggleEl = document.getElementById('toggle-dark-mode');
    if (toggleEl) {
      toggleEl.addEventListener('change', () => {
        const next = toggleEl.checked ? 'dark' : 'light';
        try { localStorage.setItem('p3d_theme_v1', next); } catch(e) {}
        applyTheme(next);
        // Update teks & icon di kartu pengaturan
        const pgIcon = document.getElementById('pengaturan-theme-icon');
        const pgLabel = document.getElementById('pengaturan-theme-label');
        const track = document.getElementById('toggle-track');
        const thumb = document.getElementById('toggle-thumb');
        if (pgIcon) pgIcon.textContent = next === 'dark' ? '🌙' : '☀️';
        if (pgLabel) pgLabel.textContent = next === 'dark' ? 'Mode Gelap Aktif' : 'Mode Terang Aktif';
        if (track) track.style.background = next === 'dark' ? 'var(--hijau-daun)' : 'var(--garis)';
        if (thumb) thumb.style.left = next === 'dark' ? '23px' : '3px';
        showToast(next === 'dark' ? '🌙 Mode Gelap diaktifkan' : '☀️ Mode Terang diaktifkan');
      });
    }

    // Render & kelola daftar Wali Kelas per Jilid — satu-satunya sumber
    // data "wali resmi" tiap kelas, dipakai konsisten di Absen, Cetak
    // Harian, dan tanda tangan Transkrip. Mengubah satu kelas TIDAK
    // memengaruhi kelas lain.
    const renderWaliKelas = async () => {
      const area = document.getElementById('area-wali-kelas');
      const daftarKelas = await this.kelasRepository.getAll();
      area.innerHTML = daftarKelas.map(k => `
        <div class="wali-kelas-row" data-kelas-id="${escapeHTML(k.id)}" style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--garis);border-radius:var(--radius-sm);background:var(--permukaan);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;">${escapeHTML(k.id)}</div>
            <div class="wali-kelas-display" style="font-size:12px;color:var(--teks-sekunder);">${escapeHTML(k.namaGuru)} · ${escapeHTML(k.ruang||'-')}</div>
            <div class="wali-kelas-edit" style="display:none;gap:6px;margin-top:6px;flex-direction:column;">
              <input type="text" class="input-wali-nama" value="${escapeHTML(k.namaGuru)}" placeholder="Nama ustadz/ah wali kelas" style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
              <input type="text" class="input-wali-ruang" value="${escapeHTML(k.ruang||'')}" placeholder="Ruang (opsional)" style="width:100%;padding:8px 10px;border:1.5px solid var(--garis);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;" />
            </div>
          </div>
          <button type="button" class="btn btn--outline btn--sm" data-action="toggle-edit-wali">✏️ Ubah</button>
          <button type="button" class="btn btn--primary btn--sm" data-action="simpan-wali" style="display:none;">💾 Simpan</button>
        </div>`).join('');

      delegate(area, 'click', '[data-action="toggle-edit-wali"]', (_e, target) => {
        const row = target.closest('.wali-kelas-row');
        row.querySelector('.wali-kelas-display').style.display = 'none';
        row.querySelector('.wali-kelas-edit').style.display = 'flex';
        target.style.display = 'none';
        row.querySelector('[data-action="simpan-wali"]').style.display = 'inline-flex';
      });
      delegate(area, 'click', '[data-action="simpan-wali"]', async (_e, target) => {
        const row = target.closest('.wali-kelas-row');
        const kelasId = row.dataset.kelasId;
        const namaBaru = row.querySelector('.input-wali-nama').value.trim();
        const ruangBaru = row.querySelector('.input-wali-ruang').value.trim();
        if (!namaBaru) { showToast('Nama wali kelas tidak boleh kosong.','error'); return; }
        try {
          await this.kelasRepository.update(kelasId, { namaGuru: namaBaru, ruang: ruangBaru });
          showToast(`Wali kelas ${kelasId} berhasil diperbarui.`);
          await renderWaliKelas();
        } catch(e) { showToast('Gagal memperbarui wali kelas.','error'); }
      });
    };
    await renderWaliKelas();

    // Load siswa untuk kelas terpilih
    const loadSiswaKelas = async (kelasId) => {
      const area = document.getElementById('area-kelola-siswa');
      const siswaList = await this.siswaRepository.getByKelas(kelasId);
      area.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;" id="list-siswa-kelas">
          ${siswaList.length === 0 ? '<p style="color:var(--teks-muted);font-size:13px;">Belum ada santri di kelas ini.</p>' :
            siswaList.map(s => `
